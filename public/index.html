<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BattleCruiser</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="icons/icon-192x192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0c1c18">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>.app-shell{display:none}.card.hidden,.lantern-wrap.hidden{display:none}</style>
</head>
<body>

  <div class="stalactites"></div>

  <div class="motes">
    <span class="mote" style="left:18%; bottom:10%; animation-delay:0s;"></span>
    <span class="mote" style="left:32%; bottom:20%; animation-delay:2s;"></span>
    <span class="mote" style="left:68%; bottom:8%; animation-delay:4s;"></span>
    <span class="mote" style="left:78%; bottom:24%; animation-delay:1s;"></span>
    <span class="mote" style="left:50%; bottom:5%; animation-delay:3s;"></span>
  </div>

  <div class="center-col">
    <form id="login-form" class="card">
      <div class="lantern-wrap" id="lantern-wrap">
      <div class="lantern-glow"></div>
      <svg class="lantern-icon" width="34" height="34" viewBox="0 0 24 24" fill="none">
        <path d="M12 2v3" stroke="#8a7038" stroke-width="1.4" stroke-linecap="round"/>
        <rect x="8" y="5" width="8" height="3" rx="1" fill="#8a7038"/>
        <path d="M9 8 L15 8 L16.5 18 C16.5 20 14.5 21.5 12 21.5 C9.5 21.5 7.5 20 7.5 18 Z" fill="#c9a24d" fill-opacity="0.9"/>
        <ellipse cx="12" cy="13" rx="2.4" ry="3.2" fill="#f5e2ac"/>
      </svg>
      <div class="status-line" id="conn-status"><span class="status-dot" id="conn-dot"></span><span id="conn-text">Conectado</span></div>
    </div>
      <h1>Battlecruiser</h1>
      <div class="rule-orn">
        <svg width="10" height="10" viewBox="0 0 10 10"><path d="M5 0 L10 5 L5 10 L0 5 Z" fill="#c9a24d"/></svg>
      </div>
      <p class="subtitle">Punto de venta — La Cueva</p>

      <div class="field">
        <label for="email">Correo</label>
        <input id="email" type="email" autocomplete="username" placeholder="tu@correo.com" required>
      </div>
      <div class="field field-pass">
        <label for="password">Contraseña</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" required>
        <button type="button" class="pass-toggle" data-target="password" aria-label="Mostrar contraseña">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>

      <button type="submit" id="login-btn">Entrar</button>
      <p class="error" id="login-error"></p>
      <button type="button" class="login-utility" id="update-app-btn-login">Actualizar app / borrar caché</button>
      <p class="footnote">v9.0 — BattleCruiser</p>
    </form>
  </div>

  <div class="app-shell" id="app-shell">
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <span class="sidebar-title">Secciones</span>
        <button id="sidebar-close-btn" type="button" class="icon-btn" aria-label="Cerrar menú">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <nav class="sidebar-nav" id="tabs">
        <button class="tab-btn active" data-tab="resumen">Centro de Control <span id="resumen-tab-badge" class="pendientes-tab-badge hidden"></span></button>
        <button class="tab-btn" data-tab="productos">Productos</button>
        <button class="tab-btn" data-tab="ventas">Ventas</button>
        <button class="tab-btn" data-tab="almacenes">Almacenes</button>
        <button class="tab-btn" data-tab="transferencias">Transferencias</button>
        <button class="tab-btn" data-tab="vales">Vales de salida</button>
        <button class="tab-btn" data-tab="pendientes">Pendientes <span id="pendientes-tab-badge" class="pendientes-tab-badge hidden"></span></button>
        <button class="tab-btn" data-tab="reportes">Reportes</button>
        <button class="tab-btn" data-tab="inventario">Inventario</button>
        <button class="tab-btn" data-tab="movimientos">Movimientos</button>
        <button class="tab-btn" data-tab="turnos">Turnos</button>
        <button class="tab-btn" data-tab="operacion">Operación</button>
        <button class="tab-btn" data-tab="comunicacion">Comunicación <span id="com-tab-badge" class="pendientes-tab-badge hidden"></span></button>
        <button class="tab-btn" data-tab="mando">Centro de Mando</button>
        <button class="tab-btn" data-tab="usuarios">Usuarios</button>
        <button class="tab-btn" data-tab="config">Configuración</button>
      </nav>
    </aside>

    <header class="app-header">
      <div class="header-left">
        <button id="sidebar-toggle-btn" type="button" class="icon-btn" aria-label="Abrir menú" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <h1>Battlecruiser</h1>
      </div>
      <div class="header-right">
        <div class="status-line status-line-app" id="conn-status-app">
          <span class="status-dot" id="conn-dot-app"></span><span id="conn-text-app">Conectado</span>
        </div>
        <span id="cola-pendientes-badge" class="cola-badge hidden"></span>
        <span id="user-email"></span>
        <div class="ajustes-wrap">
          <button id="ajustes-btn" type="button">Ajustes ▾</button>
          <div class="ajustes-menu hidden" id="ajustes-menu">
            <button type="button" id="change-pass-btn">Cambiar contraseña</button>
            <button type="button" id="update-app-btn">Actualizar app / borrar caché</button>
          </div>
        </div>
        <button id="logout-btn" type="button">Cerrar sesión</button>
      </div>
    </header>

    <main class="main-content">
    <div class="rule-orn">
      <svg width="8" height="8" viewBox="0 0 10 10"><path d="M5 0 L10 5 L5 10 L0 5 Z" fill="#c9a24d"/></svg>
    </div>

    <div class="pass-panel hidden" id="pass-panel">
      <h3>Cambiar contraseña</h3>
      <form id="form-pass">
        <div class="field field-pass">
          <label for="pass-new">Contraseña nueva</label>
          <input id="pass-new" type="password" autocomplete="new-password" placeholder="Mínimo 6 caracteres" required minlength="6">
          <button type="button" class="pass-toggle" data-target="pass-new" aria-label="Mostrar contraseña">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
        <div class="field field-pass">
          <label for="pass-confirm">Repetir contraseña</label>
          <input id="pass-confirm" type="password" autocomplete="new-password" placeholder="••••••••" required minlength="6">
          <button type="button" class="pass-toggle" data-target="pass-confirm" aria-label="Mostrar contraseña">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
        <div class="btn-row">
          <button type="submit">Guardar contraseña</button>
          <button type="button" id="pass-cancel-btn">Cancelar</button>
        </div>
        <p class="msg" id="msg-pass"></p>
      </form>
    </div>

    <!-- PLACEHOLDER: remainder of body kept identical via next tool batch -->
    <p id="bc-placeholder-rebuild">LOADING</p>
    </main>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
