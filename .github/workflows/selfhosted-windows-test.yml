name: BattleCruiser Self-Hosted Windows Test

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: battlecruiser-selfhosted-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  runner-reset:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 2
    steps:
      - name: Release stale self-hosted execution slot
        shell: cmd
        run: |
          echo Self-hosted runner reset gate.
          echo Runner: %RUNNER_NAME%
