name: BattleCruiser Self-Hosted Windows Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/selfhosted-windows-test.yml"

concurrency:
  group: battlecruiser-selfhosted-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  selfhosted-windows:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: true

      - name: Verify checkout integrity
        shell: cmd
        run: |
          git reset --hard HEAD
          git clean -ffdx
          git diff --exit-code
          git diff --cached --exit-code
          git rev-parse HEAD
          node test/ci-preflight.js

      - name: Verify runner environment
        shell: cmd
        run: |
          echo Runner: %RUNNER_NAME%
          echo OS: %RUNNER_OS%
          echo Architecture: %RUNNER_ARCH%
          node --version
          npm --version

      - name: Install dependencies
        shell: cmd
        run: npm ci

      - name: Syntax check
        shell: cmd
        run: |
          node --check public/app.js
          node --check public/service-worker.js

      - name: Focused B2/B3 diagnostics
        shell: cmd
        run: |
          echo === B2.3 ===
          node --test --test-force-exit test/b2.3-centro-control.test.js
          if errorlevel 1 exit /b 1
          echo === B3 ===
          node --test --test-force-exit test/b3-usuarios-permisos.test.js