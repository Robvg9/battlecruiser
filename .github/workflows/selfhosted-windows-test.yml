name: BattleCruiser Self-Hosted Windows Test
# ARIA runner connectivity validation: infrastructure-only trigger, no application logic change.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "public/**"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/selfhosted-windows-test.yml"
  push:
    branches: [main]
    paths:
      - "public/**"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/selfhosted-windows-test.yml"

concurrency:
  group: battlecruiser-selfhosted-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  selfhosted-windows:
    runs-on: ${{ github.event_name == 'pull_request' && contains(fromJSON('["fix/step4-vale-detail-keyboard-20261029","fix/quality-context-ready-tests-20261029","fix/ux-compact-preferences-turns-main-20261029","fix/step4-live-modal-pill-step2-20261029","fix/step4-summary-movement-route-20261029"]'), github.head_ref) && 'windows-latest' || fromJSON('["self-hosted","Windows","X64"]') }}
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: true

      - name: Verify checkout integrity
        shell: cmd
        run: |
          echo GITHUB_SHA=%GITHUB_SHA%
          node test/ci-preflight.js

      - name: Verify runner environment
        shell: cmd
        run: |
          echo Runner: %RUNNER_NAME%
          echo OS: %RUNNER_OS%
          echo Architecture: %RUNNER_ARCH%
          node --version
          npm --version

      - name: ARIA runner connectivity proof
        shell: cmd
        run: |
          echo ARIA_BATTLECRUISER_RUNNER=ONLINE
          echo RUNNER_NAME=%RUNNER_NAME%
          echo RUNNER_OS=%RUNNER_OS%
          echo RUNNER_ARCH=%RUNNER_ARCH%

      - name: Install dependencies
        shell: cmd
        run: npm ci

      - name: Syntax check
        shell: cmd
        run: |
          node --check public/app.js
          node --check public/service-worker.js

      - name: Isolated offline queue diagnostic
        shell: cmd
        run: node test/diag-offline-isolated.js

      - name: Fase C module-by-module appendChild probe
        shell: cmd
        run: node -r ./test/node-global-compat.js test/diag-fase-c-modules.js

      - name: Focused B2.3 diagnostics
        shell: cmd
        run: node -r ./test/node-global-compat.js -r ./test/b23-sync-harness.js --test --test-force-exit --test-timeout=120000 test/b2.3-centro-control.test.js

      - name: Focused B3 diagnostics
        shell: cmd
        run: node -r ./test/node-global-compat.js --test --test-force-exit --test-timeout=120000 test/b3-usuarios-permisos.test.js

      - name: Focused Fase C isolation bootstrap diagnostic
        shell: cmd
        run: |
          set BC_DIAG_BOOT=1
          node test/diag-fase-c-bootstrap.js fase-c-aislamiento.test.js
          if errorlevel 1 exit /b 1
          node test/diag-fase-c-bootstrap.js fase-c-regresion.test.js
          if errorlevel 1 exit /b 1

      - name: Full automated suite
        shell: cmd
        run: |
          set "NODE_OPTIONS=--require=./test/node-global-compat.js"
          npm test
          if errorlevel 1 exit /b 1
          set "NODE_OPTIONS="

      # Exact LIVE SHA verification is serialized in quality.yml's workflow_run,
      # after Deploy BattleCruiser PWA has finished and uploaded its verified manifest.
      # This push-triggered self-hosted workflow runs in parallel with deploy and must
      # not race production's release asset publication.
