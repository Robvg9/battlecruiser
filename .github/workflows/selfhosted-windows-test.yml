name: BattleCruiser Self-Hosted Windows Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selfhosted-windows:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify runner environment
        shell: pwsh
        run: |
          Write-Host "Runner: $env:RUNNER_NAME"
          Write-Host "OS: $env:RUNNER_OS"
          Write-Host "Architecture: $env:RUNNER_ARCH"
          node --version
          npm --version

      - name: Install dependencies
        shell: pwsh
        run: npm ci

      - name: Syntax check
        shell: pwsh
        run: |
          node --check public/app.js
          node --check public/service-worker.js

      - name: Automated tests
        shell: pwsh
        run: npm test
