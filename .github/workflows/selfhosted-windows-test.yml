name: BattleCruiser Self-Hosted Windows Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/selfhosted-windows-test.yml"

concurrency:
  group: battlecruiser-selfhosted-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  selfhosted-windows:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: true

      - name: Verify checkout integrity
        shell: cmd
        run: |
          echo GITHUB_SHA=%GITHUB_SHA%
          node test/ci-preflight.js

      - name: Verify runner environment
        shell: cmd
        run: |
          echo Runner: %RUNNER_NAME%
          echo OS: %RUNNER_OS%
          echo Architecture: %RUNNER_ARCH%
          node --version
          npm --version

      - name: Install dependencies
        shell: cmd
        run: npm ci

      - name: Syntax check
        shell: cmd
        run: |
          node --check public/app.js
          node --check public/service-worker.js

      - name: Isolated offline queue diagnostic
        shell: cmd
        run: node test/diag-offline-isolated.js

      - name: Focused B2.3 diagnostics
        shell: cmd
        run: node -r ./test/node-global-compat.js --test --test-force-exit --test-timeout=120000 test/b2.3-centro-control.test.js

      - name: Focused B3 diagnostics
        shell: cmd
        run: node -r ./test/node-global-compat.js --test --test-force-exit --test-timeout=120000 test/b3-usuarios-permisos.test.js

      - name: Full automated suite
        shell: cmd
        run: |
          set "NODE_OPTIONS=--require=./test/node-global-compat.js"
          npm test
          if errorlevel 1 exit /b 1
          set "NODE_OPTIONS="

      - name: Verify production serves current application version
        shell: cmd
        run: node test/verify-production-version.js
