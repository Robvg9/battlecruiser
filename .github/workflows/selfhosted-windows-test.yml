name: BattleCruiser Self-Hosted Windows Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selfhosted-windows:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify runner environment
        shell: cmd
        run: |
          echo Runner: %RUNNER_NAME%
          echo OS: %RUNNER_OS%
          echo Architecture: %RUNNER_ARCH%
          node --version
          npm --version

      - name: Install dependencies
        shell: cmd
        run: npm ci

      - name: Syntax check
        shell: cmd
        run: |
          node --check public/app.js
          node --check public/service-worker.js

      - name: Automated tests
        shell: cmd
        run: node --test --test-force-exit test/*.test.js
