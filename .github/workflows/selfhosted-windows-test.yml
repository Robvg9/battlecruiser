name: BattleCruiser Self-Hosted Windows Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/selfhosted-windows-test.yml"

concurrency:
  group: battlecruiser-selfhosted-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  selfhosted-windows:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15

    steps:
      - name: Configure Git PATH
        shell: powershell
        run: |
          $candidates = @(
            "C:\Program Files\Git\cmd",
            "C:\Program Files\Git\bin",
            "C:\Program Files (x86)\Git\cmd",
            "C:\Program Files (x86)\Git\bin"
          )
          $gitDir = $null
          foreach ($dir in $candidates) {
            if (Test-Path (Join-Path $dir "git.exe")) {
              $gitDir = $dir
              Add-Content -Path $env:GITHUB_PATH -Value $dir
              break
            }
          }
          if (-not $gitDir) {
            throw "Git no está instalado en las rutas estándar del runner ROBVG."
          }
          & (Join-Path $gitDir "git.exe") --version

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: true

      - name: Verify checkout integrity
        shell: cmd
        run: |
          echo GITHUB_SHA=%GITHUB_SHA%
          git --version
          node test/ci-preflight.js

      - name: Verify runner environment
        shell: cmd
        run: |
          echo Runner: %RUNNER_NAME%
          echo OS: %RUNNER_OS%
          echo Architecture: %RUNNER_ARCH%
          node --version
          npm --version

      - name: Install dependencies
        shell: cmd
        run: npm ci

      - name: Syntax check
        shell: cmd
        run: |
          node --check public/app.js
          node --check public/service-worker.js

      - name: Isolated offline queue diagnostic
        shell: cmd
        run: node test/diag-offline-isolated.js

      - name: Focused B2/B3 diagnostics
        shell: cmd
        run: |
          echo === B2.3 ===
          node --test --test-force-exit test/b2.3-centro-control.test.js
          if errorlevel 1 exit /b 1
          echo === B3 ===
          node --test --test-force-exit test/b3-usuarios-permisos.test.js