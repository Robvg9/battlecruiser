name: BattleCruiser Deploy Cloudflare

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Resolve Cloudflare account ID from API token
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          unset CLOUDFLARE_ACCOUNT_ID
          echo "🔎 Resolving Cloudflare account ID from the configured API token..."
          WHOAMI_OUTPUT="$(npx --no-install wrangler whoami 2>&1)"
          printf '%s\n' "$WHOAMI_OUTPUT"
          ACCOUNT_ID="$(printf '%s\n' "$WHOAMI_OUTPUT" | grep -Eo '[0-9a-f]{32}' | head -n 1 || true)"
          if [ -z "$ACCOUNT_ID" ]; then
            echo "❌ Could not resolve a Cloudflare account ID from wrangler whoami."
            exit 1
          fi
          echo "✅ Cloudflare account resolved."
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify production serves this commit
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_VERSION="$(grep -Eo 'const VERSION="[^"]+"' public/app.js | head -n 1 | cut -d'"' -f2)"
          if [ -z "$EXPECTED_VERSION" ]; then
            echo "❌ Could not determine expected application version from public/app.js."
            exit 1
          fi
          echo "🔎 Expected production version: $EXPECTED_VERSION"
          PROBE_URL="https://battlecruiser.robvg9.workers.dev/app.js?bc_verify=$(date +%s%N)"
          echo "🔎 Probing: $PROBE_URL"
          curl --fail --silent --show-error --location --max-time 30 \
            -H 'Cache-Control: no-cache' \
            "$PROBE_URL" -o /tmp/bc-production-app.js
          if ! grep -Fq "const VERSION=\"$EXPECTED_VERSION\"" /tmp/bc-production-app.js; then
            echo "❌ Production is not serving the expected version $EXPECTED_VERSION."
            echo "First version markers found in production:"
            grep -Eo 'const VERSION="[^"]+"' /tmp/bc-production-app.js | head -n 5 || true
            exit 1
          fi
          echo "✅ Production serves BattleCruiser $EXPECTED_VERSION."
