name: BattleCruiser Step 6 — Inventory and settlement PostgreSQL 17
on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/20261023090000_step6_inventory_movements_adjustments_settlement.sql'
      - 'test/step6-inventory-fixture.sql'
      - 'test/step6-inventory-contract.sql'
      - 'test/step6-inventory-contract.test.js'
      - '.github/workflows/step6-inventory-postgres.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  step6-postgres:
    name: Step 6 inventory, adjustment and settlement contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: battlecruiser_step6_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d battlecruiser_step6_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Build disposable schema and fixture identities
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: battlecruiser_step6_test
        run: psql -v ON_ERROR_STOP=1 -f test/step6-inventory-fixture.sql
      - name: Apply Step 6 migration to disposable PostgreSQL
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: battlecruiser_step6_test
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261023090000_step6_inventory_movements_adjustments_settlement.sql
      - name: Verify movement ledger, adjustments, ACL, and settlement transitions
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: battlecruiser_step6_test
        run: psql -v ON_ERROR_STOP=1 -f test/step6-inventory-contract.sql
