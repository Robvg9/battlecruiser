name: Optimize app.js

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-app-js.yml'

permissions:
  contents: write

jobs:
  optimize:
    if: ${{ !contains(github.event.head_commit.message, '[skip app-opt]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Minify without changing top-level API
        run: |
          npx --yes terser@5 public/app.js --compress --mangle --comments false -o public/app.js
          node --check public/app.js
      - name: Commit optimized app.js
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/app.js
          if git diff --cached --quiet; then
            echo 'No optimization changes.'
            exit 0
          fi
          git commit -m 'refactor(app): optimize app.js without functional changes [skip app-opt]'
          git push origin main
