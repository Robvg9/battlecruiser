name: BattleCruiser Optional Mixed Inventory — PostgreSQL 17
on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/20261104183000_product_mixed_inventory_variants.sql'
      - 'supabase/migrations/20261107130000_mixed_variant_warehouse_stock_minimums.sql'
      - 'test/mixed-inventory-fixture.sql'
      - 'test/mixed-inventory-contract.sql'
      - '.github/workflows/mixed-inventory-postgres.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mixed-inventory-contract:
    name: Disposable PostgreSQL mixed inventory contract
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: battlecruiser_mixed_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d battlecruiser_mixed_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Prepare disposable schema fixture
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: battlecruiser_mixed_test
        run: psql -v ON_ERROR_STOP=1 -f test/mixed-inventory-fixture.sql

      - name: Apply mixed inventory migration on disposable database
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: battlecruiser_mixed_test
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261104183000_product_mixed_inventory_variants.sql

      - name: Apply required warehouse and flavor minimum migration
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: battlecruiser_mixed_test
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261107130000_mixed_variant_warehouse_stock_minimums.sql

      - name: Verify optional variant stock and safe operations
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: battlecruiser_mixed_test
        run: psql -v ON_ERROR_STOP=1 -f test/mixed-inventory-contract.sql
