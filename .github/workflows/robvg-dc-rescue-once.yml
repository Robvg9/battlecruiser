name: RobVG Exact Scheduled Task Recovery Preflight (read-only)

on:
  push:
    branches:
      - rescue/robvg-dc-recovery-20261014
    paths:
      - '.github/workflows/robvg-dc-rescue-once.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 3
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
    steps:
      - name: Guard physical RobVG identity
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:COMPUTERNAME -ine 'ROBVG') { throw "WRONG_COMPUTER=$env:COMPUTERNAME" }
          $cfgPath = 'D:\ARIA-Windows-Agent\Data\config.json'
          if (-not (Test-Path -LiteralPath $cfgPath)) { throw "CONFIG_MISSING=$cfgPath" }
          $cfg = Get-Content -Raw -LiteralPath $cfgPath | ConvertFrom-Json
          $expected = 'windows-fe722cc6681e4f9c9cc35f5ebbb0a089'
          if ([string]$cfg.device_id -ne $expected) { throw "DEVICE_ID_MISMATCH=$($cfg.device_id)" }
          Write-Host "ROBVG_IDENTITY_GUARD=PASS COMPUTER=$env:COMPUTERNAME DEVICE_ID=$($cfg.device_id) RUNNER=$env:RUNNER_NAME"

      - name: Query exact ARIA tasks through Task Scheduler CLI and registry (no changes)
        run: |
          $ErrorActionPreference = 'Continue'
          $names = @(
            'ARIA-Desktop-Commander-Remote',
            'ARIA-Windows-Headless-Startup',
            'ARIA-Windows-Agent-Guardian',
            'ARIA-Windows-Local-Agent'
          )
          foreach ($name in $names) {
            Write-Host "EXACT_TASK_QUERY_BEGIN=$name"
            $out = @(& schtasks.exe /Query /TN $name /FO LIST /V 2>&1 | ForEach-Object { [string]$_ })
            $rc = $LASTEXITCODE
            Write-Host "EXACT_TASK_QUERY_EXIT=$name RC=$rc LINES=$($out.Count)"
            foreach ($line in $out) {
              $safe = [string]$line
              $safe = $safe -replace '(?i)Bearer\s+\S+', 'Bearer [REDACTED]'
              $safe = $safe -replace '(?i)((?:token|secret|password|authorization|api[_-]?key)\s*[:=]\s*)[^\s,;]+', '$1[REDACTED]'
              if ($safe.Length -gt 300) { $safe = $safe.Substring(0,300) }
              Write-Host "EXACT_TASK_QUERY_LINE=$name|$safe"
            }
            Write-Host "EXACT_TASK_QUERY_END=$name"
          }

          try {
            $tasks = @(
              '\ARIA-Desktop-Commander-Remote',
              '\ARIA-Windows-Headless-Startup',
              '\ARIA-Windows-Agent-Guardian',
              '\ARIA-Windows-Local-Agent'
            )
            $service = New-Object -ComObject 'Schedule.Service'
            $service.Connect()
            $root = $service.GetFolder('\')
            foreach ($taskPath in $tasks) {
              try {
                $task = $root.GetTask($taskPath)
                $def = $task.Definition
                $actions = @()
                foreach ($a in $def.Actions) {
                  $actions += @{type=[int]$a.Type;path=[string]$a.Path;arguments=[string]$a.Arguments;workingDirectory=[string]$a.WorkingDirectory}
                }
                $triggers = @()
                foreach ($tr in $def.Triggers) { $triggers += @{type=[int]$tr.Type;enabled=[bool]$tr.Enabled} }
                Write-Host "COM_EXACT_TASK=$($(@{path=$task.Path;enabled=[bool]$task.Enabled;state=[int]$task.State;lastRun=[string]$task.LastRunTime;lastResult=[string]$task.LastTaskResult;principal=[string]$def.Principal.UserId;logonType=[int]$def.Principal.LogonType;runLevel=[int]$def.Principal.RunLevel;actions=$actions;triggers=$triggers} | ConvertTo-Json -Compress -Depth 5))"
              } catch {
                Write-Host "COM_EXACT_TASK_ERROR=$taskPath|$($_.Exception.GetType().Name)|$($_.Exception.Message)"
              }
            }
          } catch { Write-Host "COM_EXACT_TASK_API_ERROR=$($_.Exception.GetType().Name):$($_.Exception.Message)" }

          $statusPath = 'D:\ARIA-Windows-Agent\Logs\desktop-commander-supervisor.json'
          if (Test-Path -LiteralPath $statusPath) {
            $s = Get-Content -Raw -LiteralPath $statusPath | ConvertFrom-Json
            Write-Host "SUPERVISOR_STATUS=$($s.state)|CHANNEL=$($s.channel_state)|PID=$($s.pid)|VERSION=$($s.version)|UPDATED=$($s.updated_at)|ENTRY=$($s.entry)"
          }
          $supervisorLog = 'D:\ARIA-Windows-Agent\Logs\desktop-commander-supervisor.log'
          if (Test-Path -LiteralPath $supervisorLog) {
            Get-Content -LiteralPath $supervisorLog -Tail 500 -ErrorAction SilentlyContinue |
              Where-Object { [string]$_ -match '(?i)CHANNEL_RESTART|CHANNEL_BACKEND_DEGRADED|CHANNEL_DEGRADED_TIMER|CHANNEL_RESTART_FAILED|REMOTE_CHANNEL_STATE|SUPERVISOR_START|START_REQUEST|STARTED pid|CHILD_CONFIRMED' } |
              Select-Object -Last 30 |
              ForEach-Object {
                $safe = [string]$_
                $safe = $safe -replace '(?i)Bearer\s+\S+','Bearer [REDACTED]'
                $safe = $safe -replace '(?i)((?:token|secret|password|authorization|api[_-]?key)\s*[:=]\s*)[^\s,;]+','$1[REDACTED]'
                if ($safe.Length -gt 300) { $safe = $safe.Substring(0,300) }
                Write-Host "SUPERVISOR_EVENT=$safe"
              }
          }
          Write-Host 'TASK_PREFLIGHT=COMPLETE_NO_CHANGES'
