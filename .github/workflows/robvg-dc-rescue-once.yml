name: RobVG Windows Task Visibility Diagnostic (isolated)

on:
  push:
    branches:
      - rescue/robvg-dc-recovery-20261014
    paths:
      - '.github/workflows/robvg-dc-rescue-once.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 4
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
    steps:
      - name: Guard physical RobVG identity
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:COMPUTERNAME -ine 'ROBVG') { throw "WRONG_COMPUTER=$env:COMPUTERNAME" }
          $cfgPath = 'D:\ARIA-Windows-Agent\Data\config.json'
          if (-not (Test-Path -LiteralPath $cfgPath)) { throw "CONFIG_MISSING=$cfgPath" }
          $cfg = Get-Content -Raw -LiteralPath $cfgPath | ConvertFrom-Json
          $expected = 'windows-fe722cc6681e4f9c9cc35f5ebbb0a089'
          if ([string]$cfg.device_id -ne $expected) { throw "DEVICE_ID_MISMATCH=$($cfg.device_id)" }
          Write-Host "ROBVG_GUARD=PASS COMPUTER=$env:COMPUTERNAME DEVICE_ID=$($cfg.device_id) RUNNER=$env:RUNNER_NAME"

      - name: Inspect execution identity, process owner, Task Scheduler namespace, and supervisor logic
        run: |
          $ErrorActionPreference = 'Continue'
          $root = 'D:\ARIA-Windows-Agent'
          $logs = Join-Path $root 'Logs'
          $statusPath = Join-Path $logs 'desktop-commander-supervisor.json'
          $supervisorScript = Join-Path $root 'Runtime\windows\desktop-commander-supervisor.ps1'
          $evidenceRoot = 'D:\Databank\RWHT\Evidence\DesktopCommanderRecovery'
          $report = [ordered]@{
            schema='robvg-task-visibility-diagnostic-v1'
            computer=$env:COMPUTERNAME
            runner=$env:RUNNER_NAME
            capturedAt=(Get-Date).ToString('o')
            identity=@{}
            targetProcess=@{}
            relatedProcesses=@()
            taskScheduler=@()
            schedulerFiles=@()
            supervisorLogic=@()
            runnerServices=@()
            noChanges=true
          }
          function Safe([string]$x) {
            $v=$x -replace '(?i)Bearer\s+\S+','Bearer [REDACTED]'
            $v=$v -replace '(?i)((?:token|secret|password|authorization|api[_-]?key)\s*[:=]\s*)[^\s,;]+','$1[REDACTED]'
            $v=$v -replace '(?i)(refresh[_-]?token\s*)[:=]\s*[^\s,;]+','$1=[REDACTED]'
            if($v.Length -gt 360){$v=$v.Substring(0,360)}
            return $v
          }
          try {
            $who = @(& whoami.exe /user 2>&1 | ForEach-Object { [string]$_ })
            $id = [Security.Principal.WindowsIdentity]::GetCurrent()
            $principal = New-Object Security.Principal.WindowsPrincipal($id)
            $report.identity = @{
              whoami=($who -join ' | ')
              name=$id.Name
              sid=[string]$id.User.Value
              isAdmin=$principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
              userProfile=$env:USERPROFILE
              userName=$env:USERNAME
            }
            Write-Host "RUNNER_IDENTITY=$($id.Name) SID=$($id.User.Value) IS_ADMIN=$($report.identity.isAdmin) USERPROFILE=$env:USERPROFILE"
            if(Test-Path -LiteralPath $statusPath){
              $s=Get-Content -Raw -LiteralPath $statusPath|ConvertFrom-Json
              $pidValue=[int]$s.pid
              $p=Get-CimInstance Win32_Process -Filter "ProcessId = $pidValue" -ErrorAction SilentlyContinue
              $owner=$null
              if($p){try{$owner=Invoke-CimMethod -InputObject $p -MethodName GetOwner -ErrorAction Stop}catch{}}
              $report.targetProcess=@{
                statusState=[string]$s.state
                statusChannel=[string]$s.channel_state
                statusUpdated=[string]$s.updated_at
                statusPid=$pidValue
                expectedEntry=[string]$s.entry
                expectedNode=[string]$s.node
                processFound=[bool]$p
                processName=if($p){[string]$p.Name}else{$null}
                processPath=if($p){[string]$p.ExecutablePath}else{$null}
                processCommandLineVisible=([bool]($p -and -not [string]::IsNullOrWhiteSpace([string]$p.CommandLine)))
                parentPid=if($p){[int]$p.ParentProcessId}else{$null}
                sessionId=if($p){[int]$p.SessionId}else{$null}
                creationDate=if($p){[string]$p.CreationDate}else{$null}
                ownerDomain=if($owner -and $owner.ReturnValue -eq 0){[string]$owner.Domain}else{$null}
                ownerName=if($owner -and $owner.ReturnValue -eq 0){[string]$owner.User}else{$null}
                ownerReturnValue=if($owner){[int]$owner.ReturnValue}else{$null}
              }
              Write-Host "TARGET_PID=$pidValue FOUND=$($report.targetProcess.processFound) NAME=$($report.targetProcess.processName) PATH=$($report.targetProcess.processPath) CMDLINE_VISIBLE=$($report.targetProcess.processCommandLineVisible) SESSION=$($report.targetProcess.sessionId) OWNER=$($report.targetProcess.ownerDomain)\$($report.targetProcess.ownerName) OWNER_RC=$($report.targetProcess.ownerReturnValue)"
              if($p){
                $parent=[int]$p.ParentProcessId
                for($depth=1;$depth -le 4 -and $parent -gt 0;$depth++){
                  $q=Get-CimInstance Win32_Process -Filter "ProcessId = $parent" -ErrorAction SilentlyContinue
                  if(-not $q){break}
                  $row=@{depth=$depth;pid=[int]$q.ProcessId;name=[string]$q.Name;parentPid=[int]$q.ParentProcessId;path=[string]$q.ExecutablePath;cmdLine=Safe ([string]$q.CommandLine);sessionId=[int]$q.SessionId}
                  $report.relatedProcesses += $row
                  Write-Host "PARENT depth=$depth pid=$($row.pid) name=$($row.name) parent=$($row.parentPid) path=$($row.path) cmd=$($row.cmdLine) session=$($row.sessionId)"
                  $parent=[int]$q.ParentProcessId
                }
              }
            }

            try {
              $svc=New-Object -ComObject 'Schedule.Service'
              $svc.Connect()
              $stack=New-Object 'System.Collections.Stack'
              $stack.Push($svc.GetFolder('\'))
              while($stack.Count -gt 0){
                $folder=$stack.Pop()
                foreach($t in @($folder.GetTasks(1))){
                  if([string]$t.Name -match '(?i)ARIA|Desktop.?Commander|Windows.?Local.?Agent|Agent.?Guardian'){
                    $actions=@()
                    foreach($a in $t.Definition.Actions){
                      $actions += @{type=[int]$a.Type;path=[string]$a.Path;arguments=Safe ([string]$a.Arguments);workingDirectory=[string]$a.WorkingDirectory}
                    }
                    $row=@{name=[string]$t.Name;path=[string]$t.Path;enabled=[bool]$t.Enabled;state=[int]$t.State;lastRun=[string]$t.LastRunTime;lastResult=[string]$t.LastTaskResult;principal=[string]$t.Definition.Principal.UserId;logonType=[int]$t.Definition.Principal.LogonType;runLevel=[int]$t.Definition.Principal.RunLevel;actions=$actions}
                    $report.taskScheduler += $row
                    Write-Host "COM_TASK=$($row|ConvertTo-Json -Compress -Depth 4)"
                  }
                }
                foreach($f in @($folder.GetFolders(0))){$stack.Push($f)}
              }
              Write-Host "COM_TASK_ENUMERATION=PASS FOUND=$($report.taskScheduler.Count)"
            } catch { Write-Host "COM_TASK_ENUMERATION_ERROR=$($_.Exception.GetType().Name):$($_.Exception.Message)" }

            try {
              $runnerSvcs=@(Get-CimInstance Win32_Service -ErrorAction Stop|Where-Object {$_.Name -match '^actions\.runner\.(Robvg9-aria-worker|Robvg9-battlecruiser)'})
              foreach($x in $runnerSvcs){
                $row=@{name=[string]$x.Name;state=[string]$x.State;startMode=[string]$x.StartMode;startName=[string]$x.StartName;processId=[int]$x.ProcessId}
                $report.runnerServices+=$row
                Write-Host "RUNNER_SERVICE=$($row|ConvertTo-Json -Compress)"
              }
            } catch { Write-Host "RUNNER_SERVICE_QUERY_ERROR=$($_.Exception.Message)" }

            $taskDir='C:\Windows\System32\Tasks'
            if(Test-Path -LiteralPath $taskDir){
              $fs=@(Get-ChildItem -LiteralPath $taskDir -Force -Recurse -ErrorAction SilentlyContinue|Where-Object {$_.FullName -match '(?i)ARIA|Desktop.?Commander|Windows.?Local.?Agent|Agent.?Guardian'}|Select-Object -First 40)
              foreach($f in $fs){$row=@{path=$f.FullName;lastWrite=$f.LastWriteTime.ToString('o');length=$f.Length};$report.schedulerFiles+=$row;Write-Host "TASK_FILE=$($row|ConvertTo-Json -Compress)"}
            }

            if(Test-Path -LiteralPath $supervisorScript){
              $logic=@(Select-String -LiteralPath $supervisorScript -Pattern '(?i)channel_unverified|channel_degraded|Stop-Process|Start-Process|Restart|child|process_alive|degraded|threshold|timer|statusPath|RemoteChannel' -ErrorAction SilentlyContinue|Select-Object -First 80)
              foreach($l in $logic){
                $row=@{line=[int]$l.LineNumber;text=Safe ([string]$l.Line)}
                $report.supervisorLogic+=$row
                Write-Host "SUPERVISOR_CODE line=$($row.line) text=$($row.text)"
              }
            } else {Write-Host "SUPERVISOR_SCRIPT_MISSING=$supervisorScript"}
          } catch {
            $report.noChanges=$true
            $report.error="$($_.Exception.GetType().Name):$($_.Exception.Message)"
            Write-Host "DIAGNOSTIC_ERROR=$($report.error)"
          } finally {
            $report.finishedAt=(Get-Date).ToString('o')
            New-Item -ItemType Directory -Path $evidenceRoot -Force -ErrorAction SilentlyContinue|Out-Null
            $evidence=Join-Path $evidenceRoot ('robvg-task-visibility-' + (Get-Date -Format 'yyyyMMdd-HHmmss') + '.json')
            $artifact=Join-Path $env:RUNNER_TEMP 'robvg-task-visibility.json'
            $json=$report|ConvertTo-Json -Depth 10
            try{
              Set-Content -LiteralPath $evidence -Value $json -Encoding UTF8
              Set-Content -LiteralPath $artifact -Value $json -Encoding UTF8
              Write-Host "EVIDENCE_PATH=$evidence"
              Write-Host "EVIDENCE_SHA256=$((Get-FileHash -LiteralPath $evidence -Algorithm SHA256).Hash)"
            }catch{Write-Host "EVIDENCE_SAVE_ERROR=$($_.Exception.Message)"}
            Write-Host 'TASK_VISIBILITY_DIAGNOSTIC=COMPLETE_NO_CHANGES'
          }

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robvg-task-visibility-evidence
          path: ${{ runner.temp }}\robvg-task-visibility.json
          if-no-files-found: warn
          retention-days: 14
