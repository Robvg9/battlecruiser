name: RobVG Desktop Commander Rescue (isolated diagnostic)

on:
  push:
    branches:
      - rescue/robvg-dc-recovery-20261014
    paths:
      - '.github/workflows/robvg-dc-rescue-once.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 4
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
    steps:
      - name: Guard physical RobVG and ARIA identity
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:COMPUTERNAME -ine 'ROBVG') { throw "WRONG_COMPUTER=$env:COMPUTERNAME; no action taken." }
          $configPath = 'D:\ARIA-Windows-Agent\Data\config.json'
          if (-not (Test-Path -LiteralPath $configPath)) { throw "CONFIG_MISSING=$configPath" }
          $cfg = Get-Content -Raw -LiteralPath $configPath | ConvertFrom-Json
          $expected = 'windows-fe722cc6681e4f9c9cc35f5ebbb0a089'
          if ([string]$cfg.device_id -ne $expected) { throw "DEVICE_ID_MISMATCH expected=$expected actual=$($cfg.device_id); no action taken." }
          Write-Host "DIAGNOSTIC_IDENTITY=PASS COMPUTER=$env:COMPUTERNAME DEVICE_ID=$($cfg.device_id)"
          Write-Host "RUNNER_NAME=$env:RUNNER_NAME RUNNER_OS=$env:RUNNER_OS RUNNER_ARCH=$env:RUNNER_ARCH"

      - name: Capture local process, task, and channel evidence without changing anything
        id: inspect
        run: |
          $ErrorActionPreference = 'Continue'
          $started = Get-Date
          $runtime = 'D:\ARIA-Windows-Agent'
          $logs = Join-Path $runtime 'Logs'
          $evidenceDir = 'D:\Databank\RWHT\Evidence\DesktopCommanderRecovery'
          $statusPath = Join-Path $logs 'desktop-commander-supervisor.json'
          $supervisorLog = Join-Path $logs 'desktop-commander-supervisor.log'
          $stdoutPath = Join-Path $logs 'desktop-commander.stdout.log'
          $stderrPath = Join-Path $logs 'desktop-commander.stderr.log'
          $report = [ordered]@{
            schema = 'robvg-dc-diagnostic-v1'
            computer = $env:COMPUTERNAME
            runner = $env:RUNNER_NAME
            capturedAt = $started.ToString('o')
            deviceId = 'windows-fe722cc6681e4f9c9cc35f5ebbb0a089'
            statusFile = $null
            processes = @()
            tasks = @()
            logTail = @()
            networkProbe = @()
            result = 'DIAGNOSTIC_ONLY_NO_CHANGES'
          }
          function Safe-Line([string]$Text) {
            $v = $Text -replace '(?i)Bearer\s+\S+', 'Bearer [REDACTED]'
            $v = $v -replace '(?i)((?:token|secret|password|authorization|api[_-]?key)\s*[:=]\s*)[^\s,;]+', '$1[REDACTED]'
            $v = $v -replace '(?i)(refresh[_-]?token\s*)[:=]\s*[^\s,;]+', '$1=[REDACTED]'
            $v = $v -replace 'https?://[^?\s]+\?[^\s]+', '[URL_QUERY_REDACTED]'
            if ($v.Length -gt 320) { $v = $v.Substring(0,320) }
            return $v
          }

          try {
            Write-Host "DIAGNOSTIC_STARTED=$($started.ToString('o'))"
            if (Test-Path -LiteralPath $statusPath) {
              $s = Get-Content -Raw -LiteralPath $statusPath | ConvertFrom-Json
              $age = [math]::Round(((Get-Date).ToUniversalTime() - (Get-Item -LiteralPath $statusPath).LastWriteTimeUtc).TotalSeconds)
              $report.statusFile = @{
                path = $statusPath
                ageSeconds = $age
                updatedAt = [string]$s.updated_at
                state = [string]$s.state
                channelState = [string]$s.channel_state
                processAlive = $s.process_alive
                pid = $s.pid
                version = [string]$s.version
                node = [string]$s.node
                entry = [string]$s.entry
                error = Safe-Line ([string]$s.error)
              }
              Write-Host "SUPERVISOR_JSON_AGE_SECONDS=$age"
              Write-Host "SUPERVISOR_STATUS=$($s.state) CHANNEL=$($s.channel_state) ALIVE=$($s.process_alive) PID=$($s.pid) VERSION=$($s.version) UPDATED=$($s.updated_at)"
              Write-Host "SUPERVISOR_ENTRY=$($s.entry)"
            } else {
              Write-Host 'SUPERVISOR_JSON=MISSING'
            }

            $allProcs = @(Get-CimInstance Win32_Process -ErrorAction SilentlyContinue)
            $relevant = @($allProcs | Where-Object {
              $_.Name -match '^(node|powershell|pwsh|cmd)(\.exe)?$' -and
              [string]$_.CommandLine -match '(?i)desktop-commander|@wonderwhy-er|npx-cli\.js|run-agent|aria-agent|supervisor'
            } | Select-Object -First 30)
            foreach ($p in $relevant) {
              $row = @{
                pid = [int]$p.ProcessId
                name = [string]$p.Name
                created = [string]$p.CreationDate
                commandLine = Safe-Line ([string]$p.CommandLine)
              }
              $report.processes += $row
              Write-Host "PROCESS pid=$($row.pid) name=$($row.name) created=$($row.created) cmd=$($row.commandLine)"
            }
            Write-Host "RELEVANT_PROCESS_COUNT=$($relevant.Count)"
            $nodeTarget = $null
            if ($report.statusFile -and $report.statusFile.pid) {
              $nodeTarget = $allProcs | Where-Object { [int]$_.ProcessId -eq [int]$report.statusFile.pid } | Select-Object -First 1
              if ($nodeTarget) {
                Write-Host "STATUS_PID_PROCESS name=$($nodeTarget.Name) pid=$($nodeTarget.ProcessId) command=$((Safe-Line ([string]$nodeTarget.CommandLine)))"
              } else {
                Write-Host "STATUS_PID_PROCESS=NOT_FOUND PID=$($report.statusFile.pid)"
              }
            }

            foreach ($taskName in @('ARIA-Desktop-Commander-Remote','ARIA-Windows-Headless-Startup','ARIA-Windows-Agent-Guardian','ARIA-Windows-Local-Agent')) {
              $t = Get-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue
              if (-not $t) {
                $row = @{name=$taskName;found=$false}
              } else {
                $ti = Get-ScheduledTaskInfo -TaskName $taskName -ErrorAction SilentlyContinue
                $actions = @($t.Actions | ForEach-Object { @{execute=[string]$_.Execute;arguments=Safe-Line ([string]$_.Arguments);workingDirectory=[string]$_.WorkingDirectory} })
                $triggers = @($t.Triggers | ForEach-Object { $_.CimClass.CimClassName -replace '^MSFT_Task','' })
                $row = @{name=$taskName;found=$true;state=[string]$t.State;lastRun=[string]$ti.LastRunTime;lastResult=[string]$ti.LastTaskResult;principal=[string]$t.Principal.UserId;logonType=[string]$t.Principal.LogonType;triggers=$triggers;actions=$actions}
              }
              $report.tasks += $row
              Write-Host "TASK_DIAG=$($row | ConvertTo-Json -Compress -Depth 4)"
            }

            foreach ($path in @($supervisorLog,$stdoutPath,$stderrPath)) {
              if (-not (Test-Path -LiteralPath $path)) { Write-Host "LOG_MISSING=$path"; continue }
              $item = Get-Item -LiteralPath $path
              Write-Host "LOG_META path=$($item.Name) bytes=$($item.Length) lastWrite=$($item.LastWriteTime.ToString('o'))"
              $tail = @(Get-Content -LiteralPath $path -Tail 22 -ErrorAction SilentlyContinue)
              foreach ($line in $tail) {
                $safe = Safe-Line ([string]$line)
                $report.logTail += @{file=$item.Name;line=$safe}
                if ([string]$line -match '(?i)error|exception|failed|disconnect|websocket|connect|401|403|unauthor|econn|timeout|closed|restart|spawn|online|register|heartbeat|refused|socket|refresh|channel') {
                  Write-Host "LOG_EVIDENCE file=$($item.Name) line=$safe"
                }
              }
            }

            $nodePath = 'D:\Databank\node\node.exe'
            if (Test-Path -LiteralPath $nodePath) {
              $js = "const urls=['https://mcp.desktopcommander.app/api/mcp-info','https://icuqsstxfdbvjytkhlog.supabase.co/rest/v1/']; Promise.all(urls.map(async u=>{try{const r=await fetch(u,{signal:AbortSignal.timeout(10000)});console.log(new URL(u).hostname+' HTTP='+r.status)}catch(e){console.log(new URL(u).hostname+' ERROR='+e.message+' CAUSE='+(e.cause?.code||'none'))}}));"
              $probe = @(& $nodePath -e $js 2>&1 | ForEach-Object { [string]$_ })
              foreach ($line in $probe) {
                $report.networkProbe += $line
                Write-Host "NETWORK_PROBE=$line"
              }
            } else { Write-Host 'NODE_RUNTIME_MISSING' }

            Write-Host 'DIAGNOSTIC_ACTIONS_TAKEN=NONE'
          } catch {
            $report.result = 'DIAGNOSTIC_ERROR'
            $report.error = "$($_.Exception.GetType().Name):$($_.Exception.Message)"
            Write-Host "DIAGNOSTIC_ERROR=$($report.error)"
          } finally {
            $report.finishedAt = (Get-Date).ToString('o')
            New-Item -ItemType Directory -Path $evidenceDir -Force -ErrorAction SilentlyContinue | Out-Null
            $evidence = Join-Path $evidenceDir ('robvg-dc-diagnostic-' + (Get-Date -Format 'yyyyMMdd-HHmmss') + '.json')
            $artifact = Join-Path $env:RUNNER_TEMP 'robvg-dc-diagnostic.json'
            $json = $report | ConvertTo-Json -Depth 8
            try {
              Set-Content -LiteralPath $evidence -Value $json -Encoding UTF8
              Set-Content -LiteralPath $artifact -Value $json -Encoding UTF8
              Write-Host "DIAGNOSTIC_EVIDENCE_PATH=$evidence"
              Write-Host "DIAGNOSTIC_EVIDENCE_SHA256=$((Get-FileHash -LiteralPath $evidence -Algorithm SHA256).Hash)"
            } catch { Write-Host "DIAGNOSTIC_EVIDENCE_SAVE_ERROR=$($_.Exception.Message)" }
            Write-Host "DIAGNOSTIC_RESULT=$($report.result)"
          }

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robvg-dc-diagnostic-evidence
          path: ${{ runner.temp }}\robvg-dc-diagnostic.json
          if-no-files-found: warn
          retention-days: 14
