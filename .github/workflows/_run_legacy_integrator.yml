name: consolidate-main
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  consolidate:
    if: ${{ contains(github.event.head_commit.message, 'CONSOLIDATE MAIN') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Consolidate unique mission improvements into current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          npm ci --ignore-scripts
          missions=(
            'R3|bebd6ea9ba6fb32c63deb5f0728c0de503b76551|d167621afd2c6b30306a177313f68243c96a23ac'
            'R7|bebd6ea9ba6fb32c63deb5f0728c0de503b76551|d18cd8e627df7e3cc0bdf76093c2835d2167a6d7'
            'R8|bebd6ea9ba6fb32c63deb5f0728c0de503b76551|de87edf057da8d2024c1ef522089f4ee04ebda0d'
            'R9|bebd6ea9ba6fb32c63deb5f0728c0de503b76551|1a63532037493ea9e4861fa534b829e736686b11'
            'R10|bebd6ea9ba6fb32c63deb5f0728c0de503b76551|9c711a56592361732516fb5bb0612a3ae01fedb3'
            'R12|bebd6ea9ba6fb32c63deb5f0728c0de503b76551|4c3d7f3c81a6e9e85be35659ca835be715636520'
          )
          for spec in "${missions[@]}"; do
            IFS='|' read -r label base head <<< "$spec"
            echo "===== INTEGRANDO $label ====="
            git fetch origin "$head" --depth=1
            if [[ "$label" == "R7" ]]; then
              git show "$head:public/app.js" > /tmp/r7-app.js
              python3 -c "from pathlib import Path; cur=Path('public/app.js').read_text(); other=Path('/tmp/r7-app.js').read_text(); start='// ---- Historial de ventas'; end='// ============================================================\\n// Sesión 21'; a=cur.find(start); b=cur.find(end,a); c=other.find(start); d=other.find(end,c); assert min(a,b,c,d)>=0; Path('public/app.js').write_text(cur[:a]+other[c:d]+cur[b:],encoding='utf-8')"
              git diff --diff-filter=ACMRT --binary "$base" "$head" -- . ':!public/app.js' > /tmp/R7.patch
              git apply --3way --theirs /tmp/R7.patch
            else
              git diff --diff-filter=ACMRT --binary "$base" "$head" > "/tmp/${label}.patch"
              git apply --3way --theirs "/tmp/${label}.patch"
            fi
            if grep -R -nE '^(<<<<<<<|=======|>>>>>>>)' public test; then exit 1; fi
            git add -A
            git diff --cached --quiet || git commit -m "consolidate $label into main"
            node --check public/app.js
            node --check test/b2.3-centro-control.test.js
            npm test
          done
          ! grep -R -nE '^(<<<<<<<|=======|>>>>>>>)' public test || exit 1
          node --check public/app.js
          node --check test/b2.3-centro-control.test.js
          npm test
          git push origin HEAD:main
