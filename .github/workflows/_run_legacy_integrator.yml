name: consolidate-main
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  consolidate:
    if: ${{ contains(github.event.head_commit.message, 'CONSOLIDATE MAIN') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Consolidate unique mission improvements into current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          npm ci --ignore-scripts

          # Final unique set. Superseded missions are deliberately not replayed:
          # R5 is included by R10, R6 by R7, R11 by R8, R13 by R3.
          missions=(
            'R3|bebd6ea9ba6fb32c63deb5f0728c0de503b76551|d167621afd2c6b30306a177313f68243c96a23ac'
            'R7|bebd6ea9ba6fb32c63deb5f0728c0de503b76551|d18cd8e627df7e3cc0bdf76093c2835d2167a6d7'
            'R8|bebd6ea9ba6fb32c63deb5f0728c0de503b76551|de87edf057da8d2024c1ef522089f4ee04ebda0d'
            'R9|bebd6ea9ba6fb32c63deb5f0728c0de503b76551|1a63532037493ea9e4861fa534b829e736686b11'
            'R10|bebd6ea9ba6fb32c63deb5f0728c0de503b76551|9c711a56592361732516fb5bb0612a3ae01fedb3'
            'R12|bebd6ea9ba6fb32c63deb5f0728c0de503b76551|4c3d7f3c81a6e9e85be35659ca835be715636520'
          )

          for spec in "${missions[@]}"; do
            IFS='|' read -r label base head <<< "$spec"
            echo "===== INTEGRANDO $label ====="
            git fetch origin "$head" --depth=1
            git diff --diff-filter=ACMRT --binary "$base" "$head" > "/tmp/${label}.patch"

            # True 3-way patch application. Git resolves only conflicting hunks
            # in favor of the mission while preserving unrelated current-main work.
            git apply --3way --theirs "/tmp/${label}.patch"

            if grep -R -nE '^(<<<<<<<|=======|>>>>>>>)' public test; then
              echo "ERROR: conflict markers remain after $label" >&2
              exit 1
            fi

            git add -A
            if git diff --cached --quiet; then
              echo "$label: no hay cambios nuevos."
            else
              git commit -m "consolidate $label into main"
            fi

            node --check public/app.js
            node --check test/b2.3-centro-control.test.js
            npm test
          done

          ! grep -R -nE '^(<<<<<<<|=======|>>>>>>>)' public test || { echo 'Conflict markers detected'; exit 1; }
          node --check public/app.js
          node --check test/b2.3-centro-control.test.js
          npm test
          git status --short
          git push origin HEAD:main
