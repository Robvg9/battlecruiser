name: consolidate-main
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  consolidate:
    if: ${{ contains(github.event.head_commit.message, 'CONSOLIDATE MAIN') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Consolidate selected mission commits into current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          npm ci --ignore-scripts

          # Unique product improvements only:
          # R4 is already merged; R7 supersedes R6; R8 supersedes R11; R3 supersedes R13.
          # The base is each mission commit's ORIGINAL parent, not the later PR base_sha.
          missions=(
            'R3|bebd6ea9ba6fb32c63deb5f0728c0de503b76551|d167621afd2c6b30306a177313f68243c96a23ac'
            'R5|bebd6ea9ba6fb32c63deb5f0728c0de503b76551|8b38f00384626b25b3f6adcd622aec096f05b65c'
            'R7|bebd6ea9ba6fb32c63deb5f0728c0de503b76551|d18cd8e627df7e3cc0bdf76093c2835d2167a6d7'
            'R8|bebd6ea9ba6fb32c63deb5f0728c0de503b76551|de87edf057da8d2024c1ef522089f4ee04ebda0d'
            'R9|bebd6ea9ba6fb32c63deb5f0728c0de503b76551|1a63532037493ea9e4861fa534b829e736686b11'
            'R10|bebd6ea9ba6fb32c63deb5f0728c0de503b76551|9c711a56592361732516fb5bb0612a3ae01fedb3'
            'R12|bebd6ea9ba6fb32c63deb5f0728c0de503b76551|4c3d7f3c81a6e9e85be35659ca835be715636520'
          )

          for spec in "${missions[@]}"; do
            IFS='|' read -r label base head <<< "$spec"
            echo "===== INTEGRANDO $label ====="
            git fetch origin "$head" --depth=1
            mapfile -t changed < <(git diff --name-status "$base" "$head")
            for row in "${changed[@]}"; do
              status="${row%%$'\t'*}"
              path="${row#*$'\t'}"
              # Never let a stale topic branch delete unrelated current-main files.
              # These missions are additive product work; deletions are skipped unless
              # explicitly reintroduced later after manual review.
              if [[ "$status" == D* ]]; then
                echo "$label: preserving current-main file deleted by stale topic: $path"
                continue
              fi
              mkdir -p "$(dirname "$path")"
              cur="$(mktemp)"; orig="$(mktemp)"; other="$(mktemp)"
              if git cat-file -e "HEAD:$path" 2>/dev/null; then git show "HEAD:$path" > "$cur"; else : > "$cur"; fi
              git show "$base:$path" > "$orig"
              git show "$head:$path" > "$other"
              rc=0
              git merge-file --union "$cur" "$orig" "$other" || rc=$?
              if grep -qE '^(<<<<<<<|=======|>>>>>>>)' "$cur"; then
                echo "ERROR: unresolved conflict markers in $path while integrating $label" >&2
                exit 1
              fi
              cp "$cur" "$path"
              rm -f "$cur" "$orig" "$other"
            done
            git add -A
            if git diff --cached --quiet; then
              echo "$label: no hay cambios nuevos."
            else
              git commit -m "consolidate $label into main"
            fi
            node --check public/app.js
            npm test
          done

          ! grep -R -nE '^(<<<<<<<|=======|>>>>>>>)' public test || { echo 'Conflict markers detected'; exit 1; }
          node --check public/app.js
          npm test
          git status --short
          git push origin HEAD:main
