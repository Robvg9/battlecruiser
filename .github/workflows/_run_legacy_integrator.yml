name: consolidate-main
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  consolidate:
    if: ${{ contains(github.event.head_commit.message, 'CONSOLIDATE MAIN') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Consolidate selected mission heads into current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          npm ci --ignore-scripts

          # Only unique improvements are replayed. R4 is already merged;
          # R7 supersedes R6, R8 supersedes R11, and R3 supersedes R13.
          missions=(
            'R3|ab46a9ae6cf49f0062f71905d345390128ae2459|d167621afd2c6b30306a177313f68243c96a23ac'
            'R5|bebd6ea9ba6fb32c63deb5f0728c0de503b76551|8b38f00384626b25b3f6adcd622aec096f05b65c'
            'R7|bebd6ea9ba6fb32c63deb5f0728c0de503b76551|d18cd8e627df7e3cc0bdf76093c2835d2167a6d7'
            'R8|bebd6ea9ba6fb32c63deb5f0728c0de503b76551|de87edf057da8d2024c1ef522089f4ee04ebda0d'
            'R9|bebd6ea9ba6fb32c63deb5f0728c0de503b76551|1a63532037493ea9e4861fa534b829e736686b11'
            'R10|bebd6ea9ba6fb32c63deb5f0728c0de503b76551|9c711a56592361732516fb5bb0612a3ae01fedb3'
            'R12|bebd6ea9ba6fb32c63deb5f0728c0de503b76551|4c3d7f3c81a6e9e85be35659ca835be715636520'
          )

          for spec in "${missions[@]}"; do
            IFS='|' read -r label base head <<< "$spec"
            echo "===== INTEGRANDO $label ====="
            git fetch origin "$head" --depth=1
            mapfile -t changed < <(git diff --name-status "$base" "$head")
            for row in "${changed[@]}"; do
              status="${row%%$'\t'*}"
              path="${row#*$'\t'}"
              if [[ "$path" == *$'\t'* ]]; then path="${path##*$'\t'}"; fi
              mkdir -p "$(dirname "$path")"
              case "$status" in
                D)
                  if git cat-file -e "HEAD:$path" 2>/dev/null; then
                    git rm -f -- "$path"
                  fi
                  ;;
                *)
                  cur="$(mktemp)"; orig="$(mktemp)"; other="$(mktemp)"
                  if git cat-file -e "HEAD:$path" 2>/dev/null; then git show "HEAD:$path" > "$cur"; else : > "$cur"; fi
                  if git cat-file -e "$base:$path" 2>/dev/null; then git show "$base:$path" > "$orig"; else : > "$orig"; fi
                  git show "$head:$path" > "$other"
                  git merge-file --union "$cur" "$orig" "$other" || rc=$?
                  rc=${rc:-0}
                  if grep -qE '^(<<<<<<<|=======|>>>>>>>)' "$cur"; then
                    echo "ERROR: conflict markers remain in $path while integrating $label" >&2
                    exit 1
                  fi
                  cp "$cur" "$path"
                  rm -f "$cur" "$orig" "$other"
                  ;;
              esac
            done
            git add -A
            if git diff --cached --quiet; then
              echo "$label: no hay cambios nuevos (ya integrado o absorbido)."
            else
              git commit -m "consolidate $label into main"
            fi
            node --check public/app.js
            npm test
          done

          # Final safety checks before touching origin/main.
          ! grep -R -nE '^(<<<<<<<|=======|>>>>>>>)' public test || { echo 'Conflict markers detected'; exit 1; }
          node --check public/app.js
          npm test
          git status --short
          git push origin HEAD:main
