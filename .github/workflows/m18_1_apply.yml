name: M18.1 apply ciclos UX

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Integrate M18.1 UI
        shell: python
        run: |
          from pathlib import Path
          p = Path('public/index.html')
          s = p.read_text(encoding='utf-8')
          start = s.index('<section id="tab-ciclos"')
          end = s.index('<section id="tab-operacion"', start)
          section = '''<section id="tab-ciclos" class="tab-panel">
            <div class="pendientes-header">
              <h3>Ciclos Operativos</h3>
              <span id="ciclos-conn-info" class="muted"></span>
            </div>
            <p class="muted">Una guía simple: ciclo → sesión → trabajar → cerrar.</p>
            <div id="ciclos-m18-root" class="m18-wrap"></div>
          </section>

          '''
          s = s[:start] + section + s[end:]
          marker = '<script src="js/ciclos.js"></script>'
          addon = marker + '\n<script src="js/m18-ciclos-ux.js"></script>'
          if 'js/m18-ciclos-ux.js' not in s:
              s = s.replace(marker, addon, 1)
          p.write_text(s, encoding='utf-8')

      - name: Validate integration
        run: |
          test -f public/js/m18-ciclos-ux.js
          grep -q 'js/m18-ciclos-ux.js' public/index.html
          grep -q 'id="ciclos-m18-root"' public/index.html

      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html
          git commit -m 'feat(m18): integrate step-by-step ciclos UI' || exit 0
          git push
