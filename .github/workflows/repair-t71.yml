name: one-shot T7.1 repair
on:
  pull_request:
    types: [opened]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Restore known-good file and apply T7.1
        shell: bash
        run: |
          set -euo pipefail
          GOOD_COMMIT=1869ad806b6b59d0bd85b607d9d97ab867f42177
          git show "$GOOD_COMMIT:public/js/offline.js" > public/js/offline.js
          python3 - <<'PY'
          from pathlib import Path
          p = Path('public/js/offline.js')
          text = p.read_text(encoding='utf-8')
          old = '''    if (cats.has("comunicacion")) {
      if (typeof refrescarListaConversaciones === "function") refrescarListaConversaciones();
      if (typeof actualizarBadgeNoLeidos === "function") actualizarBadgeNoLeidos();
    }'''
          new = '''    if (cats.has("comunicacion")) {
      if (typeof refrescarListaConversaciones === "function") refrescarListaConversaciones();
      if (typeof actualizarBadgeNoLeidos === "function") actualizarBadgeNoLeidos();
      // T7.1: refrescar chat abierto tras sync offline (quita ⏳ Pendiente).
      if (typeof _comConvActual !== "undefined" && _comConvActual && typeof refrescarMensajes === "function") {
        refrescarMensajes(_comConvActual);
      }
    }'''
          if 'PLACEHOLDER_WILL_FAIL' in text:
              raise SystemExit('ABORT: placeholder detected')
          if 'T7.1: refrescar chat abierto tras sync offline' in text:
              raise SystemExit('ABORT: T7.1 already present in source')
          if old not in text:
              raise SystemExit('ABORT: exact target block not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          node --check public/js/offline.js
          test "$(wc -c < public/js/offline.js)" -gt 50000
          ! grep -q 'PLACEHOLDER_WILL_FAIL' public/js/offline.js
          git diff --check
          test "$(git diff --numstat -- public/js/offline.js | awk '{print $1}')" = "3"
          test "$(git diff --numstat -- public/js/offline.js | awk '{print $2}')" = "0"
          rm -f .github/workflows/repair-t71.yml
          git add public/js/offline.js .github/workflows/repair-t71.yml
          git diff --cached --check
          git commit -m 'fix(offline): T7.1 refresh open chat after sync'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
