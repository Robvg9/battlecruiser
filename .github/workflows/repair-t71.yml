name: repair-t71

on:
  push:
    paths:
      - '.github/workflows/repair-t71.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore known-good offline.js and apply T7.1
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout 1869ad806b6b59d0bd85b607d9d97ab867f42177 -- public/js/offline.js
          python3 - <<'PY'
          from pathlib import Path
          p = Path('public/js/offline.js')
          s = p.read_text()
          old = '''    if (cats.has("comunicacion")) {
      if (typeof refrescarListaConversaciones === "function") refrescarListaConversaciones();
      if (typeof actualizarBadgeNoLeidos === "function") actualizarBadgeNoLeidos();
    }'''
          new = '''    if (cats.has("comunicacion")) {
      if (typeof refrescarListaConversaciones === "function") refrescarListaConversaciones();
      if (typeof actualizarBadgeNoLeidos === "function") actualizarBadgeNoLeidos();
      // T7.1: refrescar chat abierto tras sync offline (quita ⏳ Pendiente).
      if (typeof _comConvActual !== "undefined" && _comConvActual && typeof refrescarMensajes === "function") {
        refrescarMensajes(_comConvActual);
      }
    }'''
          if old not in s:
              raise SystemExit('T7.1 anchor not found; aborting without commit')
          if 'refrescarMensajes(_comConvActual)' in s:
              raise SystemExit('T7.1 already present; aborting to avoid duplicate change')
          p.write_text(s.replace(old, new, 1))
          PY
          node --check public/js/offline.js
          test "$(wc -c < public/js/offline.js)" -gt 50000

      - name: Commit repaired file
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/js/offline.js
          git diff --cached --check
          git commit -m "fix(offline): restore offline.js and apply T7.1"
          git push origin HEAD:main
