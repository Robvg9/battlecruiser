name: BattleCruiser Step 5 — Jornada PostgreSQL Integration

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/20261023050000_step5_jornada_unica_backend.sql'
      - 'test/step5-jornada-fixture.sql'
      - 'test/step5-jornada-contract.sql'
      - 'test/step5-jornada-contract.test.js'
      - '.github/workflows/step5-jornada-postgres.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jornada-postgres:
    name: Step 5 PostgreSQL 17 integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: battlecruiser_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d battlecruiser_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Create disposable baseline schema and fixture identities
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: battlecruiser_test
        run: psql -v ON_ERROR_STOP=1 -f test/step5-jornada-fixture.sql

      - name: Apply additive Step 5 migration to disposable database
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: battlecruiser_test
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261023050000_step5_jornada_unica_backend.sql

      - name: Verify jornada and rest scheduling, conflicts, historic preservation, and grants
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: battlecruiser_test
        run: psql -v ON_ERROR_STOP=1 -f test/step5-jornada-contract.sql
