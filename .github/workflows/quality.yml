name: BattleCruiser Quality

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: battlecruiser-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Production JS integrity and syntax
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git diff --exit-code
          git diff --cached --exit-code
          node test/ci-preflight.js

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: |
          node --check public/app.js
          node --check public/service-worker.js

      - name: Focused B2.3
        run: node --test --test-force-exit test/b2.3-centro-control.test.js

      - name: Focused B3
        run: node --test --test-force-exit test/b3-usuarios-permisos.test.js

      - name: Full automated suite
        run: npm test

      - name: Verify production serves current application version
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $match = Select-String -Path 'public/app.js' -Pattern 'const VERSION="([^"]+)"' | Select-Object -First 1
          if (-not $match) { throw 'Could not determine expected application version from public/app.js.' }
          $expected = $match.Matches.Groups[1].Value
          $pattern = 'const VERSION="' + $expected + '"'
          $ok = $false
          for ($attempt = 1; $attempt -le 8; $attempt++) {
            try {
              $url = "https://battlecruiser.robvg9.workers.dev/app.js?bc_verify=$([DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds())-$attempt"
              $body = (Invoke-WebRequest -UseBasicParsing -Headers @{ 'Cache-Control' = 'no-cache' } -Uri $url -TimeoutSec 30).Content
              if ($body.Contains($pattern)) { $ok = $true; break }
            } catch { Write-Host "Production probe attempt $attempt failed: $($_.Exception.Message)" }
            Start-Sleep -Seconds 10
          }
          if (-not $ok) { throw "Production is not serving expected version $expected." }