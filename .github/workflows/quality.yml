name: BattleCruiser Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: |
          node --check public/app.js
          node --check public/service-worker.js

      - name: Automated tests
        run: npm test

      - name: Verify production serves current application version
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_VERSION="$(grep -Eo 'const VERSION="[^"]+"' public/app.js | head -n 1 | cut -d'"' -f2)"
          if [ -z "$EXPECTED_VERSION" ]; then
            echo "❌ Could not determine expected application version from public/app.js."
            exit 1
          fi
          echo "🔎 Expected production version: $EXPECTED_VERSION"
          for attempt in 1 2 3 4 5; do
            PROBE_URL="https://battlecruiser.robvg9.workers.dev/app.js?bc_verify=$(date +%s%N)"
            if curl --fail --silent --show-error --location --max-time 30 \
              -H 'Cache-Control: no-cache' "$PROBE_URL" -o /tmp/bc-production-app.js; then
              if grep -Fq "const VERSION=\"$EXPECTED_VERSION\"" /tmp/bc-production-app.js; then
                echo "✅ Production serves BattleCruiser $EXPECTED_VERSION."
                exit 0
              fi
            fi
            echo "⏳ Production has not reached $EXPECTED_VERSION yet (attempt $attempt/5)."
            sleep 10
          done
          echo "❌ Production is not serving the expected version $EXPECTED_VERSION."
          echo "Version markers found in production:"
          grep -Eo 'const VERSION="[^"]+"' /tmp/bc-production-app.js | head -n 5 || true
          exit 1
