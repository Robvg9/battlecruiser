name: BattleCruiser Quality

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  # Run production E2E only after the separate deploy workflow has completed.
  # A push trigger races the deploy and can compare old LIVE assets against new source files.
  workflow_run:
    workflows: ["Deploy BattleCruiser PWA"]
    types: [completed]
    branches: [main]

concurrency:
  group: ${{ github.event_name == 'pull_request' && 'battlecruiser-pr-preview-shared' || format('battlecruiser-quality-{0}', github.ref) }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  quality:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    timeout-minutes: 35
    # Keep enough heap for the full JSDOM and integration suite.
    env:
      NODE_OPTIONS: --max-old-space-size=1536

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 1
          clean: true

      # Standard hosted Windows is free for this public repository and keeps
      # product CI independent of local machine availability.
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm

      - name: Production JS integrity and syntax
        shell: cmd
        run: node test/ci-preflight.js

      - name: Install dependencies
        shell: cmd
        run: npm ci --prefer-offline

      - name: Syntax check
        shell: cmd
        run: |
          node --check public/app.js
          node --check public/service-worker.js
          node --check test/verify-pr-preview-assets.js
          node --check test/step7-jornada-postgres-windows-ci.js
          node --check test/deploy-production-pwa.js

      - name: Focused B2.3
        shell: cmd
        run: node -r ./test/node-global-compat.js --test --test-force-exit --test-timeout=120000 test/b2.3-centro-control.test.js

      - name: Focused B3
        shell: cmd
        run: node -r ./test/node-global-compat.js --test --test-force-exit --test-timeout=120000 test/b3-usuarios-permisos.test.js

      - name: Full automated suite
        shell: cmd
        run: |
          if not exist test-results mkdir test-results
          set "NODE_OPTIONS=--max-old-space-size=1536 --require=./test/node-global-compat.js"
          npm test > test-results\quality-suite.log 2>&1
          set "SUITE_EXIT=%ERRORLEVEL%"
          type test-results\quality-suite.log
          set "NODE_OPTIONS="
          exit /b %SUITE_EXIT%

      # Pull requests have not been deployed yet, so production must still serve the base release.
      # Keep release provenance verification post-deploy only.
      - name: Download LIVE-verified release manifest from the deploy run
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: battlecruiser-release-provenance-${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          path: test-results

      - name: Verify production serves exact application release provenance
        if: github.event_name == 'workflow_run'
        env:
          BC_EXPECTED_RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          BC_EXPECTED_DEPLOY_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: cmd
        run: node test/verify-production-version.js

      # Reuse the existing free-tier preview Worker for all PRs.
      # Pull-request quality runs share one concurrency group above, so deployments
      # to this Worker remain serialized and do not consume one Worker per PR.
      - name: Deploy shared PR preview
        if: github.event_name == 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BC_PREVIEW_NAME: bc-pr-224-battlecruiser
        shell: cmd
        run: |
          if not defined CLOUDFLARE_API_TOKEN exit /b 1
          if not defined BC_PREVIEW_NAME exit /b 1
          node_modules\.bin\wrangler.cmd deploy --config wrangler.toml --name "%BC_PREVIEW_NAME%"
          if errorlevel 1 exit /b 1

      - name: Wait for shared preview assets
        if: github.event_name == 'pull_request'
        env:
          BC_PREVIEW_NAME: bc-pr-224-battlecruiser
        shell: cmd
        run: node test/verify-pr-preview-assets.js

      - name: Run real-browser offline recovery E2E
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
        env:
          BC_LIVE_BASE_URL: ${{ github.event_name == 'pull_request' && 'https://bc-pr-224-battlecruiser.robvg9.workers.dev' || 'https://battlecruiser.robvg9.workers.dev' }}
          BC_EXPECTED_RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
          BC_EXPECTED_DEPLOY_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || '' }}
        shell: cmd
        run: node test/live-offline-e2e.js

      - name: Persist LIVE offline E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: battlecruiser-live-offline-e2e-${{ github.run_id }}
          path: |
            test-results/quality-suite.log
            test-results/battlecruiser-live-offline-e2e.json
            test-results/battlecruiser-live-offline-e2e.png
            test-results/battlecruiser-android-header-layout.png
          if-no-files-found: warn
          retention-days: 90
