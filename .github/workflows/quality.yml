name: BattleCruiser Quality

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  # Run production E2E only after the separate deploy workflow has completed.
  # A push trigger races the deploy and can compare old LIVE assets against new source files.
  workflow_run:
    workflows: ["Deploy BattleCruiser PWA"]
    types: [completed]
    branches: [main]

concurrency:
  group: battlecruiser-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  quality:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 1
          clean: true

      # Use the repository's self-hosted Windows runner to avoid GitHub-hosted
      # runner billing blocks. Keep the Node runtime pinned for reproducibility.
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm

      - name: Production JS integrity and syntax
        shell: cmd
        run: node test/ci-preflight.js

      - name: Install dependencies
        shell: cmd
        run: npm ci --prefer-offline

      - name: Syntax check
        shell: cmd
        run: |
          node --check public/app.js
          node --check public/service-worker.js

      - name: Focused B2.3
        shell: cmd
        run: node -r ./test/node-global-compat.js --test --test-force-exit --test-timeout=120000 test/b2.3-centro-control.test.js

      - name: Focused B3
        shell: cmd
        run: node -r ./test/node-global-compat.js --test --test-force-exit --test-timeout=120000 test/b3-usuarios-permisos.test.js

      - name: Full automated suite
        shell: cmd
        run: |
          if not exist test-results mkdir test-results
          set "NODE_OPTIONS=--require=./test/node-global-compat.js"
          npm test > test-results\quality-suite.log 2>&1
          set "SUITE_EXIT=%ERRORLEVEL%"
          type test-results\quality-suite.log
          set "NODE_OPTIONS="
          exit /b %SUITE_EXIT%

      # Pull requests have not been deployed yet, so production must still serve the base release.
      # Keep release provenance verification post-deploy only.
      - name: Download LIVE-verified release manifest from the deploy run
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: battlecruiser-release-provenance-${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          path: test-results/release

      - name: Verify production serves exact application release provenance
        if: github.event_name == 'workflow_run'
        env:
          BC_EXPECTED_RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          BC_EXPECTED_DEPLOY_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: cmd
        run: node test/verify-production-version.js

      # Run preview deployment and browser E2E in this same self-hosted job.
      # Splitting these into more jobs caused the single local runner to leave
      # the dependent jobs queued after Quality had completed.
      - name: Deploy isolated PR preview
        if: github.event_name == 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BC_PREVIEW_NAME: bc-pr-${{ github.event.number }}-battlecruiser
        shell: cmd
        run: |
          if not defined CLOUDFLARE_API_TOKEN exit /b 1
          if not defined BC_PREVIEW_NAME exit /b 1
          node_modules\.bin\wrangler.cmd deploy --config wrangler.toml --name "%BC_PREVIEW_NAME%"
          if errorlevel 1 exit /b 1

      - name: Wait for isolated preview assets
        if: github.event_name == 'pull_request'
        env:
          BC_PREVIEW_NAME: bc-pr-${{ github.event.number }}-battlecruiser
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $base = "https://$($env:BC_PREVIEW_NAME).robvg9.workers.dev"
          $appText = Get-Content -Raw -Path "public/app.js"
          $swText = Get-Content -Raw -Path "public/service-worker.js"
          $expected = [regex]::Match($appText, 'const VERSION="([^"]*)"').Groups[1].Value
          $swExpected = [regex]::Match($swText, 'BC_SW_VERSION = "([^"]*)"').Groups[1].Value
          if (-not $expected -or -not $swExpected) { throw "Could not read app or Service Worker version from source." }
          for ($attempt = 1; $attempt -le 30; $attempt++) {
            try {
              $index = Invoke-WebRequest -UseBasicParsing -TimeoutSec 15 -Uri "$base/index.html?bc_preview_ready=$attempt"
              $app = Invoke-WebRequest -UseBasicParsing -TimeoutSec 15 -Uri "$base/app.js?bc_preview_ready=$attempt"
              $sw = Invoke-WebRequest -UseBasicParsing -TimeoutSec 15 -Uri "$base/service-worker.js?bc_preview_ready=$attempt"
              $ok = ($index.StatusCode -eq 200) -and ($app.StatusCode -eq 200) -and ($sw.StatusCode -eq 200) -and $app.Content.Contains($expected) -and $sw.Content.Contains($swExpected)
              if ($ok) {
                Write-Host "[preview] PASS — index.html, app.js and Service Worker reachable; app=$expected sw=$swExpected"
                exit 0
              }
              Write-Host "[preview] attempt $attempt/30: index=$($index.StatusCode) app=$($app.StatusCode) service-worker=$($sw.StatusCode)"
            } catch {
              Write-Host "[preview] attempt $attempt/30: $($_.Exception.Message)"
            }
            Start-Sleep -Seconds 2
          }
          throw "Preview assets failed to respond or versions did not align within 60 seconds."

      - name: Run real-browser offline recovery E2E
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
        env:
          BC_LIVE_BASE_URL: ${{ github.event_name == 'pull_request' && format('https://bc-pr-{0}-battlecruiser.robvg9.workers.dev', github.event.number) || 'https://battlecruiser.robvg9.workers.dev' }}
          BC_EXPECTED_RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
          BC_EXPECTED_DEPLOY_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || '' }}
        shell: cmd
        run: node test/live-offline-e2e.js

      - name: Persist LIVE offline E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: battlecruiser-live-offline-e2e-${{ github.run_id }}
          path: |
            test-results/quality-suite.log
            test-results/battlecruiser-live-offline-e2e.json
            test-results/battlecruiser-live-offline-e2e.png
            test-results/battlecruiser-android-header-layout.png
          if-no-files-found: warn
          retention-days: 90
