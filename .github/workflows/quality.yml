name: BattleCruiser Quality

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: battlecruiser-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: true

      # ROBVG self-hosted Windows runner has a managed Node/npm installation
      # on PATH. Avoid downloading setup-node from codeload.github.com, which
      # times out on this runner; local validation uses the same Node 24 runtime.
      - name: Production JS integrity and syntax
        shell: cmd
        run: node test/ci-preflight.js

      - name: Install dependencies
        shell: cmd
        run: npm ci

      - name: Syntax check
        shell: cmd
        run: |
          node --check public/app.js
          node --check public/service-worker.js

      - name: Focused B2.3
        shell: cmd
        run: node -r ./test/node-global-compat.js --test --test-force-exit --test-timeout=120000 test/b2.3-centro-control.test.js

      - name: Focused B3
        shell: cmd
        run: node -r ./test/node-global-compat.js --test --test-force-exit --test-timeout=120000 test/b3-usuarios-permisos.test.js

      - name: Full automated suite
        shell: cmd
        run: |
          set "NODE_OPTIONS=--require=./test/node-global-compat.js"
          npm test
          if errorlevel 1 exit /b 1
          set "NODE_OPTIONS="

      # Pull requests have not been deployed yet, so production must still serve the base release.
      # Verify the exact current app version on workflow_dispatch; post-merge deployment and Windows gates also verify LIVE.
      - name: Verify production serves current application version
        if: github.event_name != 'pull_request'
        shell: cmd
        run: node test/verify-production-version.js



  live-offline-e2e:
    name: LIVE offline recovery — Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Run real-browser LIVE offline E2E
        run: node test/live-offline-e2e.js

      - name: Persist LIVE offline E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: battlecruiser-live-offline-e2e-${{ github.run_id }}
          path: |
            test-results/battlecruiser-live-offline-e2e.json
            test-results/battlecruiser-live-offline-e2e.png
          if-no-files-found: warn
          retention-days: 90
