name: BattleCruiser Quality

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  # Run production E2E only after the separate deploy workflow has completed.
  # A push trigger races the deploy and can compare old LIVE assets against new source files.
  workflow_run:
    workflows: ["Deploy BattleCruiser PWA"]
    types: [completed]
    branches: [main]

concurrency:
  group: battlecruiser-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 1
          clean: true

      # Use hosted Windows so Quality does not depend on the physical ROBVG PC
      # or Desktop Commander. Pin Node to the same 24.19.0 runtime.
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm

      - name: Production JS integrity and syntax
        shell: cmd
        run: node test/ci-preflight.js

      - name: Install dependencies
        shell: cmd
        run: npm ci --prefer-offline

      - name: Syntax check
        shell: cmd
        run: |
          node --check public/app.js
          node --check public/service-worker.js

      - name: Focused B2.3
        shell: cmd
        run: node -r ./test/node-global-compat.js --test --test-force-exit --test-timeout=120000 test/b2.3-centro-control.test.js

      - name: Focused B3
        shell: cmd
        run: node -r ./test/node-global-compat.js --test --test-force-exit --test-timeout=120000 test/b3-usuarios-permisos.test.js

      - name: Full automated suite
        shell: cmd
        run: |
          set "NODE_OPTIONS=--require=./test/node-global-compat.js"
          npm test
          if errorlevel 1 exit /b 1
          set "NODE_OPTIONS="

      # Pull requests have not been deployed yet, so production must still serve the base release.
      # workflow_dispatch and workflow_run both verify the exact deployed version.
      - name: Verify production serves exact application release provenance
        if: github.event_name != 'pull_request'
        env:
          BC_EXPECTED_RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        shell: cmd
        run: node test/verify-production-version.js

  deploy-pr-preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Install Wrangler
        run: npm install --global wrangler@4.149.0

      - name: Deploy isolated PR preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BC_PREVIEW_NAME: bc-pr-${{ github.event.number }}-battlecruiser
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          wrangler deploy --config wrangler.toml --name "$BC_PREVIEW_NAME"

      - name: Wait for isolated preview assets
        env:
          BC_PREVIEW_NAME: bc-pr-${{ github.event.number }}-battlecruiser
        run: |
          set -euo pipefail
          base="https://${BC_PREVIEW_NAME}.robvg9.workers.dev"
          expected="$(grep -o 'const VERSION="[^"]*"' public/app.js | head -n 1)"
          sw_expected="$(grep -o 'BC_SW_VERSION = "[^"]*"' public/service-worker.js | head -n 1)"
          test -n "$expected"
          test -n "$sw_expected"
          for attempt in $(seq 1 30); do
            index_status="$(curl --location --silent --output /tmp/bc-preview-index.html --write-out '%{http_code}' "$base/index.html?bc_preview_ready=$attempt" || true)"
            app_status="$(curl --location --silent --output /tmp/bc-preview-app.js --write-out '%{http_code}' "$base/app.js?bc_preview_ready=$attempt" || true)"
            sw_status="$(curl --location --silent --output /tmp/bc-preview-sw.js --write-out '%{http_code}' "$base/service-worker.js?bc_preview_ready=$attempt" || true)"
            if [ "$index_status" = "200" ] && [ "$app_status" = "200" ] && [ "$sw_status" = "200" ] \
              && grep -Fq "$expected" /tmp/bc-preview-app.js \
              && grep -Fq "$sw_expected" /tmp/bc-preview-sw.js; then
              echo "[preview] PASS — index.html, app.js, Service Worker reachable; $expected"
              exit 0
            fi
            echo "[preview] attempt $attempt/30: index=$index_status app=$app_status service-worker=$sw_status"
            sleep 2
          done
          echo "[preview] FAIL — candidate assets not reachable or version not aligned within 60 seconds"
          exit 1

  live-offline-e2e:
    needs: [deploy-pr-preview, quality]
    if: ${{ always() && needs.quality.result == 'success' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') && (github.event_name != 'pull_request' || needs.deploy-pr-preview.result == 'success') }}
    name: LIVE offline recovery — Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Run real-browser LIVE offline E2E
        env:
          BC_LIVE_BASE_URL: ${{ github.event_name == 'pull_request' && format('https://bc-pr-{0}-battlecruiser.robvg9.workers.dev', github.event.number) || 'https://battlecruiser.robvg9.workers.dev' }}
          BC_EXPECTED_RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: node test/live-offline-e2e.js

      - name: Persist LIVE offline E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: battlecruiser-live-offline-e2e-${{ github.run_id }}
          path: |
            test-results/battlecruiser-live-offline-e2e.json
            test-results/battlecruiser-live-offline-e2e.png
            test-results/battlecruiser-android-header-layout.png
          if-no-files-found: warn
          retention-days: 90
