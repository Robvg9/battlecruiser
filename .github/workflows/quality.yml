name: BattleCruiser Quality

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: battlecruiser-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify runner environment
        shell: cmd
        run: |
          echo Runner: %RUNNER_NAME%
          echo OS: %RUNNER_OS%
          echo Architecture: %RUNNER_ARCH%
          node --version
          npm --version

      - name: Install dependencies
        shell: cmd
        run: npm ci

      - name: Syntax check
        shell: cmd
        run: |
          node --check public/app.js
          node --check public/service-worker.js

      - name: Focused B2.3
        shell: cmd
        run: node --test --test-force-exit test/b2.3-centro-control.test.js

      - name: Focused B3
        shell: cmd
        run: node --test --test-force-exit test/b3-usuarios-permisos.test.js

      - name: Full automated suite
        shell: cmd
        run: npm test

      - name: Verify production serves current application version
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $match = Select-String -Path 'public/app.js' -Pattern 'const VERSION="([^"]+)"' | Select-Object -First 1
          if (-not $match) { throw 'Could not determine expected application version from public/app.js.' }
          $expected = $match.Matches.Groups[1].Value
          Write-Host "Expected production version: $expected"
          $ok = $false
          for ($attempt = 1; $attempt -le 8; $attempt++) {
            try {
              $url = "https://battlecruiser.robvg9.workers.dev/app.js?bc_verify=$([DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds())-$attempt"
              $body = (Invoke-WebRequest -UseBasicParsing -Headers @{ 'Cache-Control' = 'no-cache' } -Uri $url -TimeoutSec 30).Content
              if ($body -like "*const VERSION=\"$expected\"*") {
                Write-Host "Production serves BattleCruiser $expected."
                $ok = $true
                break
              }
            } catch {
              Write-Host "Production probe failed on attempt $attempt: $($_.Exception.Message)"
            }
            Start-Sleep -Seconds 10
          }
          if (-not $ok) { throw "Production is not serving expected version $expected." }
