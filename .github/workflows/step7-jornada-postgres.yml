name: BattleCruiser Step 7 — Jornada inventory PostgreSQL 17
on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/20261023101500_step7_jornada_inventory_ui.sql'
      - 'supabase/migrations/20261023053011_step5_jornada_unica_backend.sql'
      - 'test/step7-jornada-fixture.sql'
      - 'test/step7-jornada-contract.sql'
      - 'test/step7-jornada-ui-contract.test.js'
      - '.github/workflows/step7-jornada-postgres.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  step7-postgres:
    name: Step 7 snapshot, gate and permission contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: battlecruiser_step7_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d battlecruiser_step7_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Build disposable fixture
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: battlecruiser_step7_test
        run: psql -v ON_ERROR_STOP=1 -f test/step7-jornada-fixture.sql
      - name: Apply Step 5 baseline
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: battlecruiser_step7_test
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261023053011_step5_jornada_unica_backend.sql
      - name: Apply Step 7 contract
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: battlecruiser_step7_test
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261023101500_step7_jornada_inventory_ui.sql
      - name: Verify session inventory lifecycle and ACL
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: battlecruiser_step7_test
        run: psql -v ON_ERROR_STOP=1 -f test/step7-jornada-contract.sql
