name: BattleCruiser Step 7 — Jornada inventory PostgreSQL 17
on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/20261023122714_step7_jornada_inventory_ui.sql'
      - 'supabase/migrations/20261031010121_step7_jornada_finanzas_carryforward.sql'
      - 'supabase/migrations/20261031224227_turno_cash_handover_owner_reconciliation_20261031.sql'
      - 'supabase/migrations/20261101001119_turnos_authenticated_rls_dependency_read.sql'
      - 'supabase/migrations/20261101005329_fix_turno_admin_permission_boundary.sql'
      - 'supabase/migrations/20261101041610_legacy_turno_jornada_reconciliation_20261101.sql'
      - 'test/turno-cash-handover-contract.sql'
      - 'test/turno-cash-handover-fixture.sql'
      - 'test/turno-cash-handover-contract.test.js'
      - 'test/turno-cash-handover-contract.sql'
      - 'public/js/turnos-maestro.js'
      - 'public/js/turno-api.js'
      - 'test/step7-jornada-finanzas-fixture.sql'
      - 'test/step7-jornada-finanzas-contract.sql'
      - 'test/step7-jornada-finanzas-carryforward.test.js'
      - 'supabase/migrations/20261023053011_step5_jornada_unica_backend.sql'
      - 'supabase/migrations/20261101030000_step5_minimum_two_day_turn.sql'
      - 'test/step7-jornada-fixture.sql'
      - 'test/step7-jornada-contract.sql'
      - 'test/step7-jornada-ui-contract.test.js'
      - 'supabase/migrations/20261026170000_bc_force_close_admin_expiry_guard.sql'
      - 'test/force-close-turno-admin-forward-migration.test.js'
      - 'test/force-close-turno-admin-fixture.sql'
      - 'test/force-close-turno-admin-contract.sql'
      - 'supabase/migrations/20261027184823_bc7_turno_movimientos_sesion_20261027.sql'
      - 'test/bc7-turno-movimientos-sesion-fixture.sql'
      - 'test/bc7-turno-movimientos-sesion-contract.sql'
      - 'test/bc7-turno-movimientos-sesion-contract.test.js'
      - 'test/step7-jornada-postgres-windows-ci.js'
      - '.github/workflows/step7-jornada-postgres.yml'
  workflow_dispatch:
concurrency:
  group: battlecruiser-step7-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  step7-postgres:
    name: Step 7 snapshot, gate and permission contract
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: true
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: PostgreSQL 17 disposable fixture, migrations and ACL contract
        shell: cmd
        env:
          BC_STEP7_POSTGRES_ROOT: C:\Users\runneradmin\AppData\Local\Temp\BattleCruiser-CI\Postgres17
        run: node test/step7-jornada-postgres-windows-ci.js
      - name: Persist PostgreSQL 17 contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: battlecruiser-step7-postgres17-${{ github.run_id }}
          path: |
            test-results/step7-postgres-ci.log
            test-results/step7-postgres-server.log
          if-no-files-found: warn
          retention-days: 90
