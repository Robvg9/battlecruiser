      - 'test/bc7-turno-movimientos-sesion-fixture.sql'
      - 'test/bc7-turno-movimientos-sesion-contract.sql'
      - 'test/bc7-turno-movimientos-sesion-contract.test.js'
      - 'test/step7-jornada-postgres-windows-ci.js'
      - '.github/workflows/step7-jornada-postgres.yml'
  workflow_dispatch:
concurrency:
  group: battlecruiser-step7-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  step7-postgres:
    name: Step 7 snapshot, gate and permission contract
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: true
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: PostgreSQL 17 disposable fixture, migrations and ACL contract
        shell: cmd
        env:
          BC_STEP7_POSTGRES_ROOT: C:\Users\runneradmin\AppData\Local\Temp\BattleCruiser-CI\Postgres17
        run: node test/step7-jornada-postgres-windows-ci.js
      - name: Persist PostgreSQL 17 contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: battlecruiser-step7-postgres17-${{ github.run_id }}
          path: |
            test-results/step7-postgres-ci.log
            test-results/step7-postgres-server.log
          if-no-files-found: warn
          retention-days: 90
