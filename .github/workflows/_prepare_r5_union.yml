name: prepare legacy R5 union
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  prepare:
    if: ${{ !contains(github.event.head_commit.message, 'legacy ') && !contains(github.event.head_commit.message, 'legacy integration complete') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "BattleCruiser Integrator"
          git config user.email "battlecruiser-integrator@users.noreply.github.com"
      - name: Apply R5 with three-way union
        run: |
          git diff --binary bebd6ea9ba6fb32c63deb5f0728c0de503b76551 8b38f00384626b25b3f6adcd622aec096f05b65c -- public/app.js public/index.html public/style.css > /tmp/r5.patch
          git apply --3way --union --index /tmp/r5.patch
      - name: Install dependencies
        run: npm ci
      - name: Validate
        run: |
          node --check public/app.js
          npm test
      - name: Commit and push directly to main
        run: |
          git add public/app.js public/index.html public/style.css
          git commit -m "legacy R5 union prepared"
          git push origin HEAD:main
