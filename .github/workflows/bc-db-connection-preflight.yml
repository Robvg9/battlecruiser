name: BattleCruiser DB Connection Preflight (Read Only)

on:
  push:
    branches:
      - backup-preflight/db-connect-20261019
    paths:
      - .github/workflows/bc-db-connection-preflight.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connection-preflight:
    name: PostgreSQL connection — read only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm secret exists without revealing it
        shell: bash
        env:
          BC_SUPABASE_DB_URL: ${{ secrets.BC_SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${BC_SUPABASE_DB_URL:-}" ]; then
            echo "BC_DB_SECRET_PRESENT=NO"
            echo "The repository secret BC_SUPABASE_DB_URL is missing or unavailable to this workflow."
            exit 2
          fi
          echo "BC_DB_SECRET_PRESENT=YES; value not printed"

      - name: Validate connection target metadata (never print password)
        shell: bash
        env:
          BC_SUPABASE_DB_URL: ${{ secrets.BC_SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if ! meta="$(node - <<'NODE'
          const raw = process.env.BC_SUPABASE_DB_URL || "";
          try {
            const u = new URL(raw);
            const username = decodeURIComponent(u.username);
            const database = decodeURIComponent(u.pathname.replace(/^\//, ""));
            if (u.protocol !== "postgres:" && u.protocol !== "postgresql:") throw new Error("scheme");
            if (!username || !u.hostname || !database) throw new Error("parts");
            process.stdout.write([username, u.hostname, u.port || "default", database].join("|"));
          } catch {
            process.exit(7);
          }
          NODE
          )"; then
            echo "BC_DB_URI_METADATA=FAIL; connection string is not a valid PostgreSQL URI. Password was not inspected or printed."
            exit 7
          fi
          IFS='|' read -r uri_user uri_host uri_port uri_db <<< "$meta"
          echo "DB_URI_USERNAME=$uri_user"
          echo "DB_URI_HOST=$uri_host"
          echo "DB_URI_PORT=$uri_port"
          echo "DB_URI_DATABASE=$uri_db"
          if [ "$uri_user" != "postgres.papxnkkjtkxsitcsvcme" ]; then
            echo "BC_DB_URI_METADATA=FAIL; Session Pooler username must be postgres.papxnkkjtkxsitcsvcme."
            exit 8
          fi
          if [ "$uri_host" != "aws-0-us-east-1.pooler.supabase.com" ] || [ "$uri_port" != "5432" ] || [ "$uri_db" != "postgres" ]; then
            echo "BC_DB_URI_METADATA=FAIL; host, port, or database does not match the Session Pooler values shown in Supabase Connect."
            exit 9
          fi
          echo "BC_DB_URI_METADATA=PASS; expected Session Pooler target; password not printed"

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Test PostgreSQL authentication with SELECT only
        shell: bash
        env:
          BC_SUPABASE_DB_URL: ${{ secrets.BC_SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          set +e
          output="$(PGCONNECT_TIMEOUT=12 psql "$BC_SUPABASE_DB_URL" \
            --no-psqlrc --tuples-only --no-align --field-separator '|' \
            --set=ON_ERROR_STOP=1 \
            --command="SELECT current_database(), current_user, current_setting('server_version');" 2>&1)"
          rc=$?
          set -e

          if [ "$rc" -ne 0 ]; then
            printf '%s\n' "$output" | sed -E 's#postgres(ql)?://[^[:space:]]+#\[REDACTED_DB_URL\]#g'
            echo "BC_DB_CONNECTION_PREFLIGHT=FAIL; no database writes were performed"
            exit "$rc"
          fi

          IFS='|' read -r db role version <<< "$output"
          if [ "$db" != "postgres" ] || [ -z "$role" ] || [ -z "$version" ]; then
            echo "BC_DB_CONNECTION_PREFLIGHT=FAIL; response did not match the expected database"
            exit 3
          fi

          echo "DATABASE_NAME=$db"
          echo "DATABASE_ROLE=$role"
          echo "POSTGRES_VERSION=$version"
          echo "BC_DB_CONNECTION_PREFLIGHT=PASS; SELECT only; no writes performed"
