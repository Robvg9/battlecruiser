name: repair legacy integrator
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ contains(github.event.head_commit.message, 'repair integrator') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair R5 patch application without destructive union
        shell: python
        run: |
          from pathlib import Path
          p=Path('.github/workflows/_integrate_legacy_missions.yml')
          s=p.read_text()
          old='git apply --3way --index /tmp/r5.patch'
          new='git apply --3way --union --index /tmp/r5.patch'
          if old not in s:
              raise SystemExit('R5 patch command anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s)
      - name: Commit repaired integrator and remove repair workflow
        run: |
          git config user.name "BattleCruiser Integrator"
          git config user.email "battlecruiser-integrator@users.noreply.github.com"
          rm -f .github/workflows/_repair_integrator.yml
          git add .github/workflows/_integrate_legacy_missions.yml .github/workflows/_repair_integrator.yml
          git commit -m "legacy integrator repaired"
          git push origin HEAD:main
