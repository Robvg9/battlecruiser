name: Import organized BattleCruiser package

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack package into repository
        run: |
          set -e
          if [ ! -f battlecruiser-main.zip ]; then
            echo "No package ZIP found; nothing to import."
            exit 0
          fi
          rm -rf /tmp/battlecruiser-package
          mkdir -p /tmp/battlecruiser-package
          unzip -q battlecruiser-main.zip -d /tmp/battlecruiser-package
          cp -a /tmp/battlecruiser-package/battlecruiser-main/. .
          rm -f battlecruiser-main.zip
          rm -f .github/workflows/import-organized-package.yml

      - name: Commit organized repository
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Organize BattleCruiser post-M3 package'
          git push origin main
