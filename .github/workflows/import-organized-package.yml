name: Import organized BattleCruiser package

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import:
    if: github.actor == 'Robvg9'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack uploaded package and organize repository
        run: |
          set -e
          test -f battlecruiser-main.zip
          rm -rf /tmp/battlecruiser-package
          mkdir -p /tmp/battlecruiser-package
          unzip -q battlecruiser-main.zip -d /tmp/battlecruiser-package
          cp -a /tmp/battlecruiser-package/battlecruiser-main/. .
          rm -f battlecruiser-main.zip
          rm -f test/b4-b8-production-hardening.sql
          cat > BATTLECRUISER_HANDOFF_POST_M3.md <<'EOF'
# BATTLECRUISER — HANDOFF POST-MISIÓN 3/3
Fecha: 2026-08-17

## Fuente de verdad
- `BATTLECRUISER_CEREBRO.md` = protocolo/arquitectura vigente.
- Código del repo = estado frontend/tests/SQL versionado entregado en este paquete.
- Supabase producción = estado backend real.
- La prueba final de Roberto sigue siendo la aceptación definitiva.

## Estado de Misión 3/3
Misión cerrada con dos limitaciones explícitas:
- `npm test` no pudo ejecutarse en el sandbox usado por Claude por falta de red/node_modules.
- No se ejecutó una carrera de concurrencia con dos conexiones SQL simultáneas reales.

No asumir que esas dos limitaciones equivalen a pruebas pasadas.

## Cambios importantes presentes en este paquete
- `public/app.js`: fixes de contratos de reportes, `data.id`/`entidad_id`, y CRUD de productos editar/activar-desactivar.
- `public/index.html`: soporte UI del modo edición de productos.
- `public/style.css`: estilos de acciones/estado de productos.
- `supabase/m3-productos-editar-estado.sql`: reconciliación de RPC de productos con producción + fix de `precio_mayorista NULL`.
- `supabase/m3-seguridad-revoke-anon-global.sql`: revocación global de EXECUTE para `anon` y default privileges.
- `supabase/b4-b8-production-hardening.sql`: hardening histórico/reconciliación B4-B8.
- `test/m3-productos-crud.test.js`: regresiones de M3; requieren dependencias del proyecto para ejecutarse.

## Importante para la siguiente IA
NO empezar a modificar código automáticamente. Primero:
1. Leer `BATTLECRUISER_CEREBRO.md`.
2. Auditar el estado REAL de estos archivos.
3. Comparar el repo con los contratos de Supabase producción si se dispone de acceso.
4. No crear duplicados de cola, sincronizador, RPC, caché, idempotencia ni arquitectura.
5. Distinguir siempre código escrito / commit / push / deploy / prueba real.
6. Si se propone una corrección, localizar primero el código exacto y justificarla.

## Organización
El archivo `test/b4-b8-production-hardening.sql` que estaba duplicado fuera de `supabase/` se eliminó del paquete organizado. La versión canónica queda en `supabase/b4-b8-production-hardening.sql`.
EOF
          rm -f .github/workflows/import-organized-package.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Organize BattleCruiser post-M3 package'
          git push origin main
