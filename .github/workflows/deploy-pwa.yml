name: Deploy BattleCruiser PWA

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'wrangler.toml'
      - '.github/workflows/deploy-pwa.yml'
      # Release provenance and the gates that prove the deployed SHA must redeploy
      # so the LIVE content-addressed manifest identifies the exact current main commit.
      - '.github/workflows/quality.yml'
      - '.github/workflows/selfhosted-windows-test.yml'
      - 'scripts/write-release-manifest.js'
      - 'test/verify-production-version.js'
      - 'test/live-offline-e2e.js'
      - 'test/release-provenance.test.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Wrangler
        run: npm install --global wrangler@4.149.0
      - name: Verify PWA
        run: |
          test -f public/index.html
          test -f public/app.js
          test -f public/service-worker.js
          grep -qi '<html' public/index.html
          grep -qi 'BattleCruiser' public/index.html
      - name: Prepare immutable release provenance
        run: |
          node scripts/write-release-manifest.js
          test -f "public/release-$GITHUB_SHA.json"
      - name: Deploy PWA
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$(grep '^account_id = ' wrangler.toml)"
          wrangler deploy --config wrangler.toml
      - name: Smoke test — exact content-addressed release manifest
        run: |
          set -euo pipefail
          base="https://battlecruiser.robvg9.workers.dev"
          release_name="release-$GITHUB_SHA.json"
          app_version="$(node -e 'const s=require("fs").readFileSync("public/app.js","utf8"); const m=s.match(/const VERSION="([^"]+)"/); if(!m) process.exit(1); process.stdout.write(m[1]);')"
          sw_version="$(node -e 'const s=require("fs").readFileSync("public/service-worker.js","utf8"); const m=s.match(/BC_SW_VERSION\s*=\s*"([^"]+)"/); if(!m) process.exit(1); process.stdout.write(m[1]);')"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "$base/?bc_deploy_ready=$GITHUB_RUN_ID-$attempt" --output /tmp/bc-live-index.html \
              && curl --fail --silent --show-error "$base/app.js?bc_deploy_ready=$GITHUB_RUN_ID-$attempt" --output /tmp/bc-live-app.js \
              && curl --fail --silent --show-error "$base/service-worker.js?bc_deploy_ready=$GITHUB_RUN_ID-$attempt" --output /tmp/bc-live-sw.js \
              && curl --fail --silent --show-error "$base/$release_name?bc_deploy_ready=$GITHUB_RUN_ID-$attempt" --output /tmp/bc-live-release.json; then
              if grep -qi '<html' /tmp/bc-live-index.html \
                && grep -qi 'BattleCruiser' /tmp/bc-live-index.html \
                && grep -Fq "const VERSION=\"$app_version\"" /tmp/bc-live-app.js \
                && grep -Fq "BC_SW_VERSION = \"$sw_version\"" /tmp/bc-live-sw.js \
                && BC_EXPECTED_RELEASE_SHA="$GITHUB_SHA" BC_EXPECTED_APP_VERSION="$app_version" BC_EXPECTED_SW_VERSION="$sw_version" BC_EXPECTED_RUN_ID="$GITHUB_RUN_ID" node -e 'const fs=require("fs"); const r=JSON.parse(fs.readFileSync("/tmp/bc-live-release.json","utf8")); const e={source_sha:process.env.BC_EXPECTED_RELEASE_SHA,app_version:process.env.BC_EXPECTED_APP_VERSION,service_worker_version:process.env.BC_EXPECTED_SW_VERSION,workflow_run_id:process.env.BC_EXPECTED_RUN_ID}; for(const k of Object.keys(e)){if(String(r[k])!==String(e[k])){console.error("[deploy smoke] manifest mismatch",k,{expected:e[k],actual:r[k]});process.exit(1)}} console.log("[deploy smoke] exact content-addressed manifest PASS",r.source_sha,r.app_version,r.workflow_run_id)'; then
                mkdir -p test-results/release
                cp /tmp/bc-live-release.json "test-results/release/$release_name"
                echo "[deploy smoke] persisted the exact LIVE manifest into test-results/release/$release_name"
                echo "BATTLECRUISER_PWA_LIVE_EXACT_SHA=PASS"
                exit 0
              fi
            fi
            echo "[deploy smoke] waiting for content-addressed release ($attempt/30)"
            sleep 2
          done
          echo "BATTLECRUISER_PWA_LIVE_EXACT_SHA=FAIL"
          exit 1

      - name: Persist LIVE-verified release provenance
        uses: actions/upload-artifact@v4
        with:
          name: battlecruiser-release-provenance-${{ github.run_id }}
          path: test-results/release/release-*.json
          if-no-files-found: error
          retention-days: 90
