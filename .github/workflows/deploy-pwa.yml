name: Deploy BattleCruiser PWA

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'wrangler.toml'
      - '.github/workflows/deploy-pwa.yml'
      - '.github/workflows/quality.yml'
      - '.github/workflows/selfhosted-windows-test.yml'
      - 'scripts/write-release-manifest.js'
      - 'test/verify-production-version.js'
      - 'test/live-offline-e2e.js'
      - 'test/release-provenance.test.js'
      - 'test/deploy-production-pwa.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    # Hosted Linux fallback avoids the unavailable Windows runner pool.
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: true
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Install Wrangler in runner temp cache
        shell: bash
        env:
          npm_config_cache: ${{ runner.temp }}/npm-cache
        run: npm install --prefix "$RUNNER_TEMP/Wrangler" --cache "$RUNNER_TEMP/npm-cache" wrangler@4.151.0
      - name: Deploy PWA and verify exact production release SHA
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BC_WRANGLER_ROOT: ${{ runner.temp }}/Wrangler
        run: node test/deploy-production-pwa.js
      - name: Persist LIVE-verified release provenance and deploy log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: battlecruiser-release-provenance-${{ github.run_id }}
          path: |
            test-results/deploy-pwa-log.txt
            test-results/release/release-*.json
          if-no-files-found: warn
          retention-days: 90
