name: Deploy BattleCruiser PWA

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'wrangler.toml'
      - '.github/workflows/deploy-pwa.yml'
      # Release provenance and the gates that prove the deployed SHA must redeploy
      # so the LIVE content-addressed manifest identifies the exact current main commit.
      - '.github/workflows/quality.yml'
      - '.github/workflows/selfhosted-windows-test.yml'
      - 'scripts/write-release-manifest.js'
      # Any test-only commit changes the canonical main SHA used by release provenance.
      # Redeploy on all test changes so the LIVE manifest can certify that exact commit.
      - 'test/**'
  workflow_dispatch:

concurrency:
  group: battlecruiser-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    # Standard hosted Windows is free for this public repository and avoids
    # coupling LIVE deploys to the local ROBVG runner's availability.
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: true
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Reuse Wrangler from persistent D drive cache
        shell: cmd
        env:
          BC_WRANGLER_ROOT: ${{ runner.temp }}\BattleCruiser-CI\Wrangler
          npm_config_cache: ${{ runner.temp }}\npm-cache
        run: |
          node -e "try { const p = require(process.env.BC_WRANGLER_ROOT + '/node_modules/wrangler/package.json'); process.exit(p.version === '4.151.0' ? 0 : 1); } catch (_) { process.exit(1); }"
          if errorlevel 1 (
            npm.cmd install --prefix "%BC_WRANGLER_ROOT%" --cache "%npm_config_cache%" wrangler@4.151.0
            if errorlevel 1 exit /b 1
          )
          if not exist "%BC_WRANGLER_ROOT%\\node_modules\\wrangler\\bin\\wrangler.js" exit /b 1
          node "%BC_WRANGLER_ROOT%\\node_modules\\wrangler\\bin\\wrangler.js" --version
      - name: Deploy PWA and verify exact production release SHA
        shell: cmd
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BC_WRANGLER_ROOT: ${{ runner.temp }}\BattleCruiser-CI\Wrangler
        run: node test/deploy-production-pwa.js
      - name: Persist LIVE-verified release provenance and deploy log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: battlecruiser-release-provenance-${{ github.run_id }}
          path: |
            test-results/deploy-pwa-log.txt
            test-results/release/release-*.json
          if-no-files-found: warn
          retention-days: 90
