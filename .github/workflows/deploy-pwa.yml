name: Deploy BattleCruiser PWA

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'wrangler.toml'
      - '.github/workflows/deploy-pwa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Wrangler
        run: npm install --global wrangler@4.149.0
      - name: Verify PWA
        run: |
          test -f public/index.html
          test -f public/app.js
          grep -qi '<html' public/index.html
          grep -qi 'BattleCruiser' public/index.html
      - name: Deploy PWA
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$(grep '^account_id = ' wrangler.toml)"
          wrangler deploy --config wrangler.toml
      - name: Smoke test
        run: |
          set -euo pipefail
          html=""
          for attempt in $(seq 1 30); do
            html="$(curl --fail --silent --show-error --retry 2 --retry-delay 1 'https://battlecruiser.robvg9.workers.dev/' 2>/dev/null || true)"
            if grep -qi '<html' <<<"$html" && grep -qi 'BattleCruiser' <<<"$html"; then break; fi
            test "$attempt" -lt 30 && sleep 2
          done
          test -n "$html"
          grep -qi '<html' <<<"$html"
          grep -qi 'BattleCruiser' <<<"$html"
          echo BATTLECRUISER_PWA_LIVE=PASS
