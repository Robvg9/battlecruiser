name: Deploy BattleCruiser PWA

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'wrangler.toml'
      - '.github/workflows/deploy-pwa.yml'
      # Release provenance and the gates that prove the deployed SHA must redeploy
      # so the LIVE marker identifies the exact current main commit.
      - '.github/workflows/quality.yml'
      - 'scripts/write-release-manifest.js'
      - 'test/verify-production-version.js'
      - 'test/live-offline-e2e.js'
      - 'test/release-provenance.test.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Wrangler
        run: npm install --global wrangler@4.149.0
      - name: Verify PWA
        run: |
          test -f public/index.html
          test -f public/app.js
          test -f public/service-worker.js
          grep -qi '<html' public/index.html
          grep -qi 'BattleCruiser' public/index.html
      - name: Prepare immutable release provenance
        run: node scripts/write-release-manifest.js
      - name: Deploy PWA
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$(grep '^account_id = ' wrangler.toml)"
          wrangler deploy --config wrangler.toml
      - name: Smoke test — exact release provenance in index.html
        run: |
          set -euo pipefail
          base="https://battlecruiser.robvg9.workers.dev"
          app_version="$(node -e 'const s=require("fs").readFileSync("public/app.js","utf8"); const m=s.match(/const VERSION="([^"]+)"/); if(!m) process.exit(1); process.stdout.write(m[1]);')"
          sw_version="$(node -e 'const s=require("fs").readFileSync("public/service-worker.js","utf8"); const m=s.match(/BC_SW_VERSION\s*=\s*"([^"]+)"/); if(!m) process.exit(1); process.stdout.write(m[1]);')"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "$base/index.html?bc_deploy_ready=$GITHUB_RUN_ID-$attempt" --output /tmp/bc-live-index.html \
              && curl --fail --silent --show-error "$base/app.js?bc_deploy_ready=$GITHUB_RUN_ID-$attempt" --output /tmp/bc-live-app.js \
              && curl --fail --silent --show-error "$base/service-worker.js?bc_deploy_ready=$GITHUB_RUN_ID-$attempt" --output /tmp/bc-live-sw.js; then
              if grep -qi '<html' /tmp/bc-live-index.html \
                && grep -qi 'BattleCruiser' /tmp/bc-live-index.html \
                && grep -Fq "const VERSION=\"$app_version\"" /tmp/bc-live-app.js \
                && grep -Fq "BC_SW_VERSION = \"$sw_version\"" /tmp/bc-live-sw.js \
                && grep -Fq "BC_RELEASE_SOURCE_SHA=$GITHUB_SHA" /tmp/bc-live-index.html \
                && grep -Fq "BC_RELEASE_APP_VERSION=$app_version" /tmp/bc-live-index.html \
                && grep -Fq "BC_RELEASE_SERVICE_WORKER_VERSION=$sw_version" /tmp/bc-live-index.html \
                && grep -Fq "BC_RELEASE_WORKFLOW_RUN_ID=$GITHUB_RUN_ID" /tmp/bc-live-index.html \
                && ! grep -Fq "BC_RELEASE_SOURCE_SHA=" /tmp/bc-live-app.js \
                && ! grep -Fq "BC_RELEASE_SOURCE_SHA=" /tmp/bc-live-sw.js; then
                echo "[deploy smoke] exact LIVE source SHA in index.html; app.js and Service Worker remain byte-identical PASS"
                echo "BATTLECRUISER_PWA_LIVE_EXACT_SHA=PASS"
                exit 0
              fi
            fi
            echo "[deploy smoke] waiting for exact release assets ($attempt/30)"
            sleep 2
          done
          echo "BATTLECRUISER_PWA_LIVE_EXACT_SHA=FAIL"
          exit 1
