name: integrate legacy missions into main

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, 'legacy integration complete') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "BattleCruiser Integrator"
          git config user.email "battlecruiser-integrator@users.noreply.github.com"

      - name: Reset integration workspace to current main
        run: git reset --hard origin/main

      - name: Apply mission code changes (tests handled separately)
        shell: bash
        run: |
          apply_code() {
            local label="$1" base="$2" head="$3"
            shift 3
            echo "=== $label ==="
            git diff --binary "$base" "$head" -- "$@" > "/tmp/${label}.patch"
            if [ -s "/tmp/${label}.patch" ]; then
              git apply --3way --index "/tmp/${label}.patch"
            fi
          }

          apply_code r3 ab46a9ae6cf49f0062f71905d345390128ae2459 d167621afd2c6b30306a177313f68243c96a23ac public/app.js public/style.css
          git commit -m "integrate R3: actionable low-stock alerts"

          apply_code r5 bebd6ea9ba6fb32c63deb5f0728c0de503b76551 8b38f00384626b25b3f6adcd622aec096f05b65c public/app.js public/index.html public/style.css
          git commit -m "integrate R5: searchable sales history"

          # R6 is superseded by R7: R7 contains the same actionable sale detail plus the mathematical audit.
          apply_code r7 bebd6ea9ba6fb32c63deb5f0728c0de503b76551 d18cd8e627df7e3cc0bdf76093c2835d2167a6d7 public/app.js public/index.html public/style.css
          git commit -m "integrate R7: sales audit"

          # R8 supersedes the narrower R11/R12 implementations: it contains both transfer and voucher details.
          apply_code r8 bebd6ea9ba6fb32c63deb5f0728c0de503b76551 de87edf057da8d2024c1ef522089f4ee04ebda0d public/app.js public/index.html public/style.css
          git commit -m "integrate R8: transfer and voucher audit details"

          apply_code r9 bebd6ea9ba6fb32c63deb5f0728c0de503b76551 1a63532037493ea9e4861fa534b829e736686b11 public/app.js public/index.html public/style.css
          git commit -m "integrate R9: actionable recent movements"

          apply_code r10 bebd6ea9ba6fb32c63deb5f0728c0de503b76551 9c711a56592361732516fb5bb0612a3ae01fedb3 public/app.js public/index.html public/style.css
          git commit -m "integrate R10: operational movement filters"

          apply_code r13 bebd6ea9ba6fb32c63deb5f0728c0de503b76551 7a063c6e9937d3f79812e6efc637c6323b12cc6a public/app.js public/index.html public/style.css
          git commit -m "integrate R13: actionable control-center alerts"

      - name: Append mission tests without test-file merge conflicts
        shell: bash
        run: |
          append_tests() {
            local base="$1" head="$2" label="$3"
            git diff --unified=0 "$base" "$head" -- test/b2.3-centro-control.test.js \
              | awk '/^\+\+\+/{next} /^\+/{sub(/^\+/, ""); print}' >> "/tmp/${label}-tests.js"
            cat "/tmp/${label}-tests.js" >> test/b2.3-centro-control.test.js
          }
          append_tests bebd6ea9ba6fb32c63deb5f0728c0de503b76551 8b38f00384626b25b3f6adcd622aec096f05b65c r5
          append_tests bebd6ea9ba6fb32c63deb5f0728c0de503b76551 d18cd8e627df7e3cc0bdf76093c2835d2167a6d7 r7
          append_tests bebd6ea9ba6fb32c63deb5f0728c0de503b76551 de87edf057da8d2024c1ef522089f4ee04ebda0d r8
          append_tests bebd6ea9ba6fb32c63deb5f0728c0de503b76551 1a63532037493ea9e4861fa534b829e736686b11 r9
          append_tests bebd6ea9ba6fb32c63deb5f0728c0de503b76551 9c711a56592361732516fb5bb0612a3ae01fedb3 r10
          append_tests bebd6ea9ba6fb32c63deb5f0728c0de503b76551 7a063c6e9937d3f79812e6efc637c6323b12cc6a r13
          node --check test/b2.3-centro-control.test.js
          git add test/b2.3-centro-control.test.js
          git commit -m "integrate legacy mission tests R5-R13"

      - name: Verify final code
        run: |
          node --check public/app.js
          npm test

      - name: Remove integration workflow and push final main
        run: |
          git rm .github/workflows/_integrate_legacy_missions.yml
          git commit -m "docs: legacy integration complete [skip ci]"
          git push origin HEAD:main
