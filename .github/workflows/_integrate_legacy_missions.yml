      - name: Integrate R9 recent movement navigation
        shell: python
        run: |
          from pathlib import Path
          p=Path('public/app.js'); s=p.read_text()
          old='''    const movs = [\n      ...(_cache.ventas || []).map((v) => ({\n        fecha: v.fecha, texto: `Venta: ${v.almacenes && v.almacenes.nombre ? v.almacenes.nombre : "?"}`, estado: "$" + money(v.total),\n      })),\n      ..._cache.transferencias.map((t) => ({\n        fecha: t.fecha, texto: `Transferencia: ${t.origen.nombre} → ${t.destino.nombre}`, estado: t.estado,\n      })),\n      ..._cache.vales.map((v) => ({\n        fecha: v.fecha, texto: `Vale (${v.tipo}): ${v.productos.nombre} · ${v.almacenes.nombre}`, estado: money(v.cantidad),\n      })),\n    ].sort((a, b) => new Date(b.fecha) - new Date(a.fecha)).slice(0, 8);'''.replace('\\n','\n')
          # R3/R2 current main may already have slightly different labels; use the exact current block if present.
          if old not in s:
              start=s.find('    const movs = [', s.find('const movsEl'))
              end=s.find('    ].sort((a, b) => new Date(b.fecha) - new Date(a.fecha)).slice(0, 8);',start)
              if start<0 or end<0: raise SystemExit('R9 movement block anchor missing')
              end += len('    ].sort((a, b) => new Date(b.fecha) - new Date(a.fecha)).slice(0, 8);')
              old=s[start:end]
          new='''    const movs = [\n      ...(_cache.ventas || []).map((v) => ({ tipo:"venta", id:v.id, fecha:v.fecha, texto:`Venta: ${v.almacenes && v.almacenes.nombre ? v.almacenes.nombre : "—"}`, estado:"$"+money(v.total) })),\n      ..._cache.transferencias.map((t) => ({ tipo:"transferencia", id:t.id, fecha:t.fecha, texto:`Transferencia: ${t.origen ? t.origen.nombre : "—"} → ${t.destino ? t.destino.nombre : "—"}`, estado:t.estado })),\n      ..._cache.vales.map((v) => ({ tipo:"vale", id:v.id, fecha:v.fecha, texto:`Vale (${v.tipo || "?"}): ${v.productos ? v.productos.nombre : "—"} · ${v.almacenes ? v.almacenes.nombre : "—"}`, estado:money(v.cantidad) })),\n    ].sort((a,b)=>new Date(b.fecha)-new Date(a.fecha)).slice(0,8);'''.replace('\\n','\n')
          s=s.replace(old,new,1)
          old2='''        const div = document.createElement("div");\n        div.className = "lista-item";\n        div.innerHTML = `<span>${fechaCorta(m.fecha)}</span>\n          <span class="muted">${m.texto} · ${m.estado}</span>`;'''.replace('\\n','\n')
          new2='''        const div = document.createElement("div");\n        const tabDestino = m.tipo === "venta" ? "ventas" : m.tipo === "transferencia" ? "transferencias" : "vales";\n        div.className = "lista-item lista-item-accion resumen-mov-item";\n        div.setAttribute("data-mov-tipo",m.tipo); div.setAttribute("data-mov-id",m.id||""); div.setAttribute("data-mov-tab",tabDestino); div.setAttribute("role","button"); div.setAttribute("tabindex","0");\n        div.innerHTML = `<span>${fechaCorta(m.fecha)} <span class="muted">· ${escHtml(m.tipo)}</span></span><span class="muted">${m.texto} · ${m.estado}</span>`;'''.replace('\\n','\n')
          if old2 not in s: raise SystemExit('R9 item anchor missing')
          s=s.replace(old2,new2,1)
          marker='// Un solo listener delegado para +/-, edición directa y "Quitar" dentro del\n// carrito'
          nav='''// R9: navegación desde Últimos movimientos del Centro de Control.\nsafeInit("resumen-movs-accion",()=>{const movsEl=document.getElementById("resumen-movs-lista");if(!movsEl)return;const navegar=target=>{const item=target.closest(".resumen-mov-item[data-mov-tab]");if(!item)return;const btn=document.querySelector('.tab-btn[data-tab="'+item.getAttribute("data-mov-tab")+'"]');if(btn)btn.click();};movsEl.addEventListener("click",e=>navegar(e.target));movsEl.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){if(e.target.closest(".resumen-mov-item[data-mov-tab]")){e.preventDefault();navegar(e.target);}}});});\n\n'''
          if 'safeInit("resumen-movs-accion"' not in s: s=s.replace(marker,nav+marker,1)
          p.write_text(s)

      - name: Append all non-redundant mission tests
        shell: bash
        run: |
          append_tests() {
            local base="$1" head="$2" label="$3"
            git diff --unified=0 "$base" "$head" -- test/b2.3-centro-control.test.js \
              | awk '/^\+\+\+/{next} /^\+/{sub(/^\+/, ""); print}' >> "/tmp/${label}-tests.js"
            cat "/tmp/${label}-tests.js" >> test/b2.3-centro-control.test.js
          }
          append_tests bebd6ea9ba6fb32c63deb5f0728c0de503b76551 8b38f00384626b25b3f6adcd622aec096f05b65c r5
          append_tests bebd6ea9ba6fb32c63deb5f0728c0de503b76551 d18cd8e627df7e3cc0bdf76093c2835d2167a6d7 r7
          append_tests bebd6ea9ba6fb32c63deb5f0728c0de503b76551 de87edf057da8d2024c1ef522089f4ee04ebda0d r8
          append_tests bebd6ea9ba6fb32c63deb5f0728c0de503b76551 1a63532037493ea9e4861fa534b829e736686b11 r9
          append_tests bebd6ea9ba6fb32c63deb5f0728c0de503b76551 9c711a56592361732516fb5bb0612a3ae01fedb3 r10
          node --check test/b2.3-centro-control.test.js
          git add test/b2.3-centro-control.test.js
          git commit -m "integrate legacy mission tests R5-R10"

      - name: Verify final code
        run: |
          node --check public/app.js
          npm test

      - name: Remove integration workflow and push final main
        run: |
          git rm .github/workflows/_integrate_legacy_missions.yml
          git commit -m "docs: legacy integration complete [skip ci]"
