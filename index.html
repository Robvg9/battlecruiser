<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Battlecruiser</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b111a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<!-- Fallback inline: si por alguna razón style.css no carga (ej. servidor mal
     configurado), al menos el layout base y el botón "Cerrar sesión" quedan
     ocultos por defecto en vez de mostrarse ambas pantallas a la vez. -->
<style>.app-shell{display:none}.card.hidden,.lantern-wrap.hidden{display:none}</style>
</head>
<body>

  <div class="stalactites">
    <svg viewBox="0 0 800 90" preserveAspectRatio="none">
      <path d="M0,0 L0,20 L14,42 L22,20 L34,50 L46,22 L60,38 L60,0 Z" fill="#141d2b"/>
      <path d="M740,0 L740,26 L752,44 L764,18 L776,46 L788,24 L800,34 L800,0 Z" fill="#141d2b"/>
    </svg>
  </div>

  <div class="motes">
    <span class="mote" style="left:18%; bottom:10%; animation-delay:0s;"></span>
    <span class="mote" style="left:32%; bottom:20%; animation-delay:2s;"></span>
    <span class="mote" style="left:68%; bottom:8%; animation-delay:4s;"></span>
    <span class="mote" style="left:78%; bottom:24%; animation-delay:1s;"></span>
    <span class="mote" style="left:50%; bottom:5%; animation-delay:3s;"></span>
  </div>

  <div class="center-col">
    <div class="lantern-wrap" id="lantern-wrap">
      <div class="lantern-glow"></div>
      <svg class="lantern-icon" width="34" height="34" viewBox="0 0 24 24" fill="none">
        <path d="M12 2v3" stroke="#8a6329" stroke-width="1.4" stroke-linecap="round"/>
        <rect x="8" y="5" width="8" height="3" rx="1" fill="#8a6329"/>
        <path d="M9 8 L15 8 L16.5 18 C16.5 20 14.5 21.5 12 21.5 C9.5 21.5 7.5 20 7.5 18 Z" fill="#d99a43" fill-opacity="0.9"/>
        <ellipse cx="12" cy="13" rx="2.4" ry="3.2" fill="#fce3b0"/>
      </svg>
      <div class="status-line" id="conn-status"><span class="status-dot" id="conn-dot"></span><span id="conn-text">Conectado</span></div>
    </div>

    <form id="login-form" class="card">
      <h1>Battlecruiser</h1>
      <p class="subtitle">PUNTO DE VENTA — LA CUEVA</p>

      <div class="field">
        <label for="email">Correo</label>
        <input id="email" type="email" autocomplete="username" placeholder="tu@correo.com" required>
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" required>
      </div>

      <button type="submit" id="login-btn">Entrar</button>
      <p class="error" id="login-error"></p>
      <p class="footnote">v2.1 · La Cueva</p>
    </form>
  </div>

  <div class="app-shell" id="app-shell">
    <header class="app-header">
      <h1>Battlecruiser</h1>
      <div class="header-right">
        <span id="user-email"></span>
        <button id="change-pass-btn" type="button">Cambiar contraseña</button>
        <button id="update-app-btn" type="button">Actualizar app</button>
        <button id="logout-btn" type="button">Cerrar sesión</button>
      </div>
    </header>

    <div class="pass-panel hidden" id="pass-panel">
      <h3>Cambiar contraseña</h3>
      <form id="form-pass">
        <div class="field">
          <label for="pass-new">Contraseña nueva</label>
          <input id="pass-new" type="password" autocomplete="new-password" placeholder="Mínimo 6 caracteres" required minlength="6">
        </div>
        <div class="field">
          <label for="pass-confirm">Repetir contraseña</label>
          <input id="pass-confirm" type="password" autocomplete="new-password" placeholder="••••••••" required minlength="6">
        </div>
        <div class="btn-row">
          <button type="submit">Guardar contraseña</button>
          <button type="button" id="pass-cancel-btn">Cancelar</button>
        </div>
        <p class="msg" id="msg-pass"></p>
      </form>
    </div>

    <nav class="tabs" id="tabs">
      <button class="tab-btn active" data-tab="productos">Productos</button>
      <button class="tab-btn" data-tab="almacenes">Almacenes</button>
      <button class="tab-btn" data-tab="transferencias">Transferencias</button>
      <button class="tab-btn" data-tab="vales">Vales de salida</button>
    </nav>

    <section id="tab-productos" class="tab-panel visible">
      <form id="form-producto" class="inline-form">
        <input id="prod-nombre" placeholder="Nombre del producto" required>
        <select id="prod-categoria"><option value="">Categoría</option></select>
        <input id="prod-unidad" placeholder="Unidad (ej. unidad, caja)">
        <input id="prod-precio-normal" type="number" step="0.01" placeholder="Precio normal" required>
        <input id="prod-precio-mayorista" type="number" step="0.01" placeholder="Precio mayorista" required>
        <button type="submit">Agregar producto</button>
      </form>
      <div id="lista-productos" class="lista"></div>

      <h3>Registrar compra (entrada de stock)</h3>
      <form id="form-compra" class="inline-form">
        <select id="compra-producto" required></select>
        <select id="compra-almacen" required></select>
        <input id="compra-cantidad" type="number" step="0.01" placeholder="Cantidad" required>
        <input id="compra-costo" type="number" step="0.01" placeholder="Costo unitario" required>
        <button type="submit">Registrar compra</button>
      </form>
      <p class="msg" id="msg-productos"></p>
    </section>

    <section id="tab-almacenes" class="tab-panel">
      <form id="form-almacen" class="inline-form">
        <input id="alm-nombre" placeholder="Nombre del almacén" required>
        <select id="alm-tipo" required>
          <option value="">Tipo</option>
          <option value="venta">Venta (precio normal)</option>
          <option value="mayorista">Almacén / mayorista (precio mayorista)</option>
        </select>
        <button type="submit">Agregar almacén</button>
      </form>
      <div id="lista-almacenes" class="lista"></div>
      <h3>Stock por almacén</h3>
      <div id="lista-stock" class="lista"></div>
      <p class="msg" id="msg-almacenes"></p>
    </section>

    <section id="tab-transferencias" class="tab-panel">
      <form id="form-transferencia" class="inline-form">
        <select id="trf-origen" required></select>
        <select id="trf-destino" required></select>
        <select id="trf-producto" required></select>
        <input id="trf-cantidad" type="number" step="0.01" placeholder="Cantidad" required>
        <button type="submit">Transferir</button>
      </form>
      <div id="lista-transferencias" class="lista"></div>
      <p class="msg" id="msg-transferencias"></p>
    </section>

    <section id="tab-vales" class="tab-panel">
      <form id="form-vale" class="inline-form">
        <select id="vale-producto" required></select>
        <select id="vale-almacen" required></select>
        <select id="vale-tipo" required>
          <option value="">Tipo</option>
          <option value="merma">Merma</option>
          <option value="donacion">Donación</option>
          <option value="regalo">Regalo</option>
          <option value="vencido">Vencido</option>
        </select>
        <input id="vale-cantidad" type="number" step="0.01" placeholder="Cantidad" required>
        <button type="submit">Registrar vale</button>
      </form>
      <div id="lista-vales" class="lista"></div>
      <p class="msg" id="msg-vales"></p>
    </section>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
